<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081a4b">
<title>Team – Liga Manager</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#071640;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:44px;height:44px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff12;color:#fff;font-size:28px}
h1{font-size:24px;margin:0} .muted{opacity:.62;font-size:12px}
.card{background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:15px;margin:10px 0}
.hero{display:flex;gap:14px;align-items:center}
.logo{width:76px;height:76px;border-radius:18px;background:#ffffff12;display:grid;place-items:center;font-size:25px;font-weight:900;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.k{background:#ffffff09;border:1px solid #ffffff15;border-radius:12px;padding:10px} .k b{display:block;font-size:18px;margin-top:3px}
.players{display:grid;gap:8px}
.player{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:#ffffff08;border-radius:12px;padding:9px}
.photo{width:48px;height:48px;border-radius:12px;background:#ffffff15;object-fit:cover;display:grid;place-items:center;font-weight:900}
.pos{font-size:10px;opacity:.62} .rating{font-weight:900}
.teamtabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#ffffff08;border:1px solid #ffffff15;border-radius:12px;padding:5px;margin:12px 0}.teamtab{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;border-radius:9px;padding:10px;font-size:11px;font-weight:800}.teamtab.active{background:#2457ff}.empty{opacity:.6;padding:18px;text-align:center}
button{font:inherit}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const STORAGE_KEY="liga-manager-v5";
function loadState(){
  try{
    const snap=sessionStorage.getItem("lmTeamState");
    if(snap){
      const o=JSON.parse(snap);
      if(o && Array.isArray(o.teams)) return o;
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const o=JSON.parse(raw);
      if(o && Array.isArray(o.teams)) return o;
    }
  }catch(e){}
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    try{
      const o=JSON.parse(localStorage.getItem(k));
      if(o && Array.isArray(o.teams)) return o;
    }catch(e){}
  }
  return {teams:[],players:[]};
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function init(n){return String(n||"?").trim().slice(0,2).toUpperCase()}
function overall(players){
  const starters=players.filter(p=>p.starter);
  if(!starters.length) return "—";
  const sum=starters.reduce((a,p)=>a+Number(p.rating||0),0);
  return (sum/starters.length).toFixed(2);
}
function back(){
  if(history.length>1) history.back();
  else location.href="index.html";
}
function render(){
  const s=loadState();
  const params=new URLSearchParams(location.search);
  const id=params.get("id");
  const requestedName=params.get("name")||"Team";
  const t=s.teams.find(x=>String(x.id)===String(id));
  const app=document.getElementById("app");
  if(!t){
    app.innerHTML=`<div class="top"><button class="back" onclick="back()">‹</button><div><h1>${esc(requestedName)}</h1><div class="muted">Teamdetails · v29</div></div></div>
    <div class="card"><div class="hero"><div class="logo">${esc(init(requestedName))}</div><div><h1 style="font-size:20px">${esc(requestedName)}</h1><div class="muted">Teamdetails</div></div></div>
    <div class="kv"><div class="k"><span class="muted">Gesamtstärke</span><b>—</b></div><div class="k"><span class="muted">Spieler</span><b>0</b></div></div></div>
    <div class="card empty">Die Teamdaten konnten aus der App nicht übernommen werden. Bitte zurückgehen und das Team erneut über „ÖFFNEN“ öffnen.</div></div>`;
    return;
  }
  const ps=s.players.filter(p=>String(p.team)===String(t.id));
  const logo=t.logo?'<img src="'+t.logo.replace(/"/g,'&quot;')+'">':init(t.name);
  app.innerHTML=`
    <div class="top">
      <button class="back" onclick="back()">‹</button>
      <div><h1>${esc(t.name)}</h1><div class="muted">Teamdetails · v29</div></div>
    </div>
    <div class="card">
      <div class="hero">
        <div class="logo">${logo}</div>
        <div><h1 style="font-size:20px">${esc(t.name)}</h1><div class="muted">${ps.length} Spieler</div></div>
      </div>
      <div class="kv">
        <div class="k"><span class="muted">Gesamtstärke</span><b>${overall(ps)}</b></div>
        <div class="k"><span class="muted">Startelf</span><b>${ps.filter(p=>p.starter).length} / 11</b></div>
      </div>
    </div>
    <div class="card">
      <h2 style="margin:0 0 10px">Spieler</h2>
      <div class="players">
        ${ps.length?ps.map(p=>`<div class="player">
          ${p.photo?`<img class="photo" src="${p.photo}">`:`<div class="photo">${init(p.name)}</div>`}
          <div><b>${esc(p.name)}</b><div class="pos">${esc(p.pos||"")} · ${p.starter?"STARTELF":"BANK"}</div></div>
          <div class="rating">${p.rating??"—"}</div>
        </div>`).join(""):'<div class="empty">Noch keine Spieler.</div>'}
      </div>
    </div>`;
}
render();
</script>
</body>
</html>
