<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081a4b"><title>Spiele – Liga Manager</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#071640;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px 14px 50px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:44px;height:44px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff12;color:#fff;font-size:28px}
h1,h2{margin:0}h1{font-size:24px}h2{font-size:19px}.muted{opacity:.62;font-size:12px}
.card{background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:15px;margin:10px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#ffffff08;border:1px solid #ffffff15;border-radius:12px;padding:5px;margin:12px 0}.tab{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;border-radius:9px;padding:11px;font-size:11px;font-weight:800}.tab.active{background:#2457ff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff12}.row:last-child{border-bottom:0}.num{font-size:18px;font-weight:900}
.game{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #ffffff12}.game:last-child{border-bottom:0}.opp{font-weight:800}.result{font-weight:900;text-align:right}.win{font-weight:900}.loss{font-weight:900}.draw{font-weight:900}.empty{opacity:.6;padding:18px;text-align:center}.backlink{display:inline-block;color:#fff;text-decoration:none;opacity:.7;font-size:12px;margin-top:8px}
</style></head><body><div id="app" class="wrap"></div><script>

const STORAGE_KEY="liga-manager-v5";
function loadState(){
  /* Always prefer the current localStorage data. The session snapshot can be stale
     when the fixture list was changed after the team page was opened. */
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.teams)){o.players=o.players||[];o.matches=o.matches||[];return o}}
  }catch(e){}
  try{
    const snap=sessionStorage.getItem("lmTeamState");
    if(snap){const o=JSON.parse(snap);if(o&&Array.isArray(o.teams)){o.players=o.players||[];o.matches=o.matches||[];return o}}
  }catch(e){}
  return {teams:[],players:[],matches:[]};
}
const s=loadState();
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tid(){return new URLSearchParams(location.search).get("id")}
function teamName(id){const t=s.teams.find(x=>String(x.id)===String(id));return t?t.name:"Unbekannter Gegner"}
function back(){location.href="team.html?id="+encodeURIComponent(tid()||"")}
function ensureCareer(p,id){p.careerByTeam=p.careerByTeam||{};p.seasonHistoryByTeam=p.seasonHistoryByTeam||{};p.careerByTeam[id]=p.careerByTeam[id]||{goals:0,assists:0,apps:0};p.seasonHistoryByTeam[id]=p.seasonHistoryByTeam[id]||[]}
function career(p,id,k){ensureCareer(p,id);return Number(p.careerByTeam[id][k])||0}
function lastSeason(p,id,k){ensureCareer(p,id);const a=p.seasonHistoryByTeam[id];return a.length?Number(a[a.length-1][k])||0:0}
function currentSeason(){const x=s.tournaments?.find(x=>String(x.id)===String(s.currentTournament));return x?.season||"Aktuelle Saison"}
function currentTournament(){return s.tournaments?.find(x=>String(x.id)===String(s.currentTournament))||s.tournaments?.[0]||null}
function teamObj(id){return s.teams.find(x=>String(x.id)===String(id))||null}

function render(){
 const t=s.teams.find(x=>String(x.id)===String(tid()));if(!t){document.getElementById("app").innerHTML='<div class="card empty">Team nicht gefunden.</div>';return}
 const id=String(t.id),ct=currentTournament(),ms=(s.matches||[]).filter(m=>(!m.tournamentId || (ct&&String(m.tournamentId)===String(ct.id))) && (String(m.home)===id||String(m.away)===id)).sort((a,b)=>(Number(a.round)||0)-(Number(b.round)||0));
 const past=ms.filter(m=>m.played).slice(-5).reverse(),next=ms.filter(m=>!m.played).slice(0,5);
 function row(m,done){const home=String(m.home)===id,oppId=home?m.away:m.home,opp=teamName(oppId),oppTeam=teamObj(oppId);let res="—";if(done){const gf=home?Number(m.hg):Number(m.ag),ga=home?Number(m.ag):Number(m.hg);res=gf>ga?`<span class="win">Sieg ${gf}:${ga}</span>`:gf<ga?`<span class="loss">Niederlage ${gf}:${ga}</span>`:`<span class="draw">Remis ${gf}:${ga}</span>`}return `<div class="game"><div><div class="muted">Spieltag ${esc(m.round??"—")}</div><div class="opp">${home?"🏟️":"✈️"} ${oppTeam?.logo?`<img src="${esc(oppTeam.logo)}" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin:0 5px 0 2px;border-radius:5px">`:""}${esc(opp)}</div><div class="muted">${esc(m.date||"")} ${esc(m.time||"")}</div></div><div class="result">${res}</div></div>`}
 document.getElementById("app").innerHTML=`<div class="top"><button class="back" onclick="back()">‹</button><div><h1>${esc(t.name)}</h1><div class="muted">SPIELE · v47</div></div></div>
 <div class="tabs"><a class="tab" href="stats.html?id=${encodeURIComponent(t.id)}">STATISTIK</a><a class="tab active" href="games.html?id=${encodeURIComponent(t.id)}">SPIELE</a></div>
 <div class="card"><h2>LETZTE 5 SPIELE</h2>${past.length?past.map(m=>row(m,true)).join(""):'<div class="empty">Noch keine vergangenen Spiele.</div>'}</div>
 <div class="card"><h2>NÄCHSTE 5 SPIELE</h2>${next.length?next.map(m=>row(m,false)).join(""):'<div class="empty">Keine kommenden Spiele vorhanden.</div>'}</div>
 <a class="backlink" href="team.html?id=${encodeURIComponent(t.id)}">← Zurück zur Übersicht</a>`}
render();
</script></body></html>
