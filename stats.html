<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081a4b"><title>Statistik</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#071640;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px 14px 50px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:44px;height:44px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff12;color:#fff;font-size:28px}
h1,h2{margin:0}h1{font-size:24px}h2{font-size:19px}.muted{opacity:.62;font-size:12px}
.card{background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:15px;margin:10px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#ffffff08;border:1px solid #ffffff15;border-radius:12px;padding:5px;margin:12px 0}
.tab{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;border-radius:9px;padding:11px;font-size:11px;font-weight:800}
.tab.active{background:#2457ff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff12}
.row:last-child{border-bottom:0}.num{font-size:18px;font-weight:900}.empty{opacity:.6;padding:18px;text-align:center}
.game{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #ffffff12}
.game:last-child{border-bottom:0}.opp{font-weight:800}.result{font-weight:900;text-align:right}.win{font-weight:900}.loss{font-weight:900}.draw{font-weight:900}
.backlink{display:inline-block;color:#fff;text-decoration:none;opacity:.7;font-size:12px;margin-top:8px}
</style></head><body><div id="app" class="wrap"></div><script>

const STORAGE_KEY="liga-manager-v5";
function loadState(){
  try{
    const snap=sessionStorage.getItem("lmTeamState");
    if(snap){const o=JSON.parse(snap);if(o&&Array.isArray(o.teams)){if(!Array.isArray(o.players))o.players=[];if(!Array.isArray(o.matches))o.matches=[];return o;}}
  }catch(e){}
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.teams)){if(!Array.isArray(o.players))o.players=[];if(!Array.isArray(o.matches))o.matches=[];return o;}}
  }catch(e){}
  return {teams:[],players:[],matches:[]};
}
const s=loadState();
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function teamName(id){const t=s.teams.find(x=>String(x.id)===String(id));return t?t.name:"Unbekannter Gegner"}
function teamId(){return new URLSearchParams(location.search).get("id")}
function back(){location.href="team.html?id="+encodeURIComponent(teamId()||"")}
function matches(){return Array.isArray(s.matches)?s.matches:[]}
function sortMatches(a,b){const ra=Number(a.round)||0,rb=Number(b.round)||0;return ra-rb||String(a.date||"").localeCompare(String(b.date||""))}

const t=s.teams.find(x=>String(x.id)===String(teamId()));
function render(){
 if(!t){document.getElementById("app").innerHTML='<div class="card empty">Team nicht gefunden.</div>';return}
 const ps=s.players.filter(p=>String(p.team)===String(t.id));
 const mode=new URLSearchParams(location.search).get("stat")||"last";
 const pool=mode==="all"?ps.map(p=>{const a=p.history&&p.history.allTime||{};return Object.assign({},p,{goals:(Number(p.goals)||0)+(Number(a.goals)||0),assists:(Number(p.assists)||0)+(Number(a.assists)||0)})}):ps;
 const scorers=[...pool].sort((a,b)=>(Number(b.goals)||0)-(Number(a.goals)||0));
 const assists=[...pool].sort((a,b)=>(Number(b.assists)||0)-(Number(a.assists)||0));
 document.getElementById("app").innerHTML=`<div class="top"><button class="back" onclick="back()">‹</button><div><h1>${esc(t.name)}</h1><div class="muted">Statistik · v38</div></div></div>
 <div class="tabs"><a class="tab active" href="stats.html?id=${encodeURIComponent(t.id)}&stat=last">STATISTIK</a><a class="tab" href="games.html?id=${encodeURIComponent(t.id)}">SPIELE</a></div>
 <div class="tabs"><a class="tab ${mode==="last"?"active":""}" href="stats.html?id=${encodeURIComponent(t.id)}&stat=last">LETZTE SAISON</a><a class="tab ${mode==="all"?"active":""}" href="stats.html?id=${encodeURIComponent(t.id)}&stat=all">ALL TIME</a></div>
 <div class="card"><h2>TORJÄGER</h2>${scorers.length?scorers.map((p,i)=>`<div class="row"><div><b>${i+1}. ${esc(p.name)}</b><div class="muted">${esc(p.pos||"")}</div></div><div><span class="num">${p.goals||0}</span> <span class="muted">Tore</span></div></div>`).join(""):'<div class="empty">Noch keine Tore erfasst.</div>'}</div>
 <div class="card"><h2>VORLAGEN GEBER</h2>${assists.length?assists.map((p,i)=>`<div class="row"><div><b>${i+1}. ${esc(p.name)}</b><div class="muted">${esc(p.pos||"")}</div></div><div><span class="num">${p.assists||0}</span> <span class="muted">Assists</span></div></div>`).join(""):'<div class="empty">Noch keine Assists erfasst.</div>'}</div>
 <a class="backlink" href="team.html?id=${encodeURIComponent(t.id)}">← Zurück zur Übersicht</a>`}
render();
</script></body></html>
