<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081a4b"><title>Spiel – Liga Manager</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#071640;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:16px 14px 50px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:44px;height:44px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff12;color:#fff;font-size:28px}.card{background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:15px;margin:10px 0}h1,h2,h3{margin:0}h1{font-size:23px}h2{font-size:18px}.muted{opacity:.62;font-size:12px}.hero{display:flex;align-items:center;justify-content:space-between;gap:10px}.team{width:38%;text-align:center;font-weight:800}.team img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 7px}.score{font-size:30px;font-weight:900;white-space:nowrap}.pitch{background:linear-gradient(180deg,#164d37,#0f402d);border:1px solid #ffffff25;border-radius:18px;padding:10px 7px;margin-top:12px;position:relative;overflow:hidden}.pitch:before{content:"";position:absolute;inset:6% 8%;border:1px solid #ffffff42;border-radius:8px;pointer-events:none}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;border:1px solid #ffffff42;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.line{display:flex;justify-content:center;gap:6px;position:relative;z-index:1;margin:7px 0}.slot{width:76px;min-height:70px;border:1px solid #ffffff40;background:#ffffff15;color:#fff;border-radius:11px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.slot.filled{background:#071b43;border-color:#ffffff55}.slot img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#ffffff15}.initial{width:34px;height:34px;border-radius:50%;background:#ffffff15;display:grid;place-items:center;font-size:10px;font-weight:900}.slot b{font-size:9px;max-width:69px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot span{font-size:8px;opacity:.62}.formation{text-align:center;font-weight:900;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.empty{opacity:.6;text-align:center;padding:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #ffffff22;background:#ffffff10;color:#fff;border-radius:11px;padding:11px 13px;font-weight:800;text-decoration:none}.note{font-size:11px;opacity:.55;line-height:1.4;margin-top:9px}@media(max-width:390px){.slot{width:67px}.slot b{max-width:60px}.team img{width:54px;height:54px}}

.goalbox{margin-top:12px}.goalform{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px}.goalform input,.goalform select{width:100%;min-width:0;background:#081a4b;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:11px;font-size:12px}.goalbtn{width:100%;margin-top:8px;background:#2457ff;color:#fff;border:0;border-radius:11px;padding:12px;font-weight:900}.event{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff12}.event:last-child{border-bottom:0}.event small{opacity:.6}.del{border:1px solid #ff4d6d;background:#ff4d6d18;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.ratingrow{display:grid;grid-template-columns:1fr 82px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff12}.ratingrow input{width:100%;background:#081a4b;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:10px;text-align:center}.editxi{margin-top:10px;width:100%;background:#ffffff12;color:#fff;border:1px solid #ffffff25;border-radius:11px;padding:11px;font-weight:900}.sheetbg{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:30}.sheet{width:100%;max-width:620px;margin:auto;background:#0b1b4b;border:1px solid #ffffff20;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow:auto}.sheet select,.sheet input{width:100%;background:#071640;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:11px;margin:6px 0;font-size:13px}.sheet .btnrow{display:flex;gap:8px;margin-top:8px}.sheet .btnrow button{flex:1}.primary{background:#2457ff!important}.subrow{display:grid;grid-template-columns:58px 1fr 1fr auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff12}.subrow button{padding:8px 10px}.subform{display:grid;grid-template-columns:65px 1fr 1fr;gap:7px;margin-top:10px}.subform button{grid-column:1/-1;background:#2457ff;color:#fff;border:0;border-radius:11px;padding:11px;font-weight:900}@media(max-width:390px){.subrow{grid-template-columns:48px 1fr 1fr auto}.subform{grid-template-columns:60px 1fr 1fr}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const KEY='liga-manager-v5';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
const s=load(), q=new URLSearchParams(location.search), mid=q.get('id');
let match=(s.matches||[]).find(m=>String(m.id)===String(mid))||null;
if(!match){try{const x=JSON.parse(sessionStorage.getItem('lmMatchSnapshot')||'null');if(x&&String(x.id)===String(mid))match=x;}catch(e){}}
const teams=s.teams||[], players=s.players||[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function team(idOrName){
  if(idOrName&&typeof idOrName==='object') return idOrName;
  let t=teams.find(t=>String(t.id)===String(idOrName));
  if(t)return t;
  return teams.find(t=>String(t.name||'').trim().toLowerCase()===String(idOrName||'').trim().toLowerCase())||null;
}
function pname(t,fallback){return t?.name||fallback||'Team'}
function crest(t){return t?.logo?'<img src="'+esc(t.logo)+'" alt="">':''}
function initials(n){return esc(String(n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}
function teamPlayers(t){
  if(!t)return [];
  return players.filter(p=>String(p.team)===String(t.id));
}
function playerById(t,pid){
  return teamPlayers(t).find(p=>String(p.id)===String(pid))||players.find(p=>String(p.id)===String(pid))||null;
}
const formations={
 '4-3-3':[['ST'],['LW','RW'],['LCM','CM','RCM'],['LB','LCB','RCB','RB'],['TW']],
 '4-4-2':[['ST','ST'],['LM','LCM','RCM','RM'],['LB','LCB','RCB','RB'],['TW']],
 '4-2-3-1':[['ST'],['LW','CAM','RW'],['LDM','RDM'],['LB','LCB','RCB','RB'],['TW']],
 '4-1-4-1':[['ST'],['LM','LCM','RCM','RM'],['CDM'],['LB','LCB','RCB','RB'],['TW']],
 '3-5-2':[['ST','ST'],['LWB','LCM','CM','RCM','RWB'],['LCB','CB','RCB'],['TW']],
 '3-4-3':[['LW','ST','RW'],['LM','LCM','RCM','RM'],['LCB','CB','RCB'],['TW']],
 '5-3-2':[['ST','ST'],['LCM','CM','RCM'],['LWB','LCB','CB','RCB','RWB'],['TW']],
 '5-4-1':[['ST'],['LM','LCM','RCM','RM'],['LWB','LCB','CB','RCB','RWB'],['TW']]
};
function lineupFor(t,side){
  if(!t)return null;
  if(side && match.lineups && match.lineups[side] && Object.keys(match.lineups[side].slots||{}).length){
    return {formation:match.lineups[side].formation||'4-3-3',slots:{...match.lineups[side].slots}};
  }
  if(t.lineup?.slots && Object.keys(t.lineup.slots).length)return {formation:t.lineup.formation||'4-3-3',slots:{...t.lineup.slots}};
  const starters=teamPlayers(t).filter(p=>p.starter||p.startXI||p.startelf).slice(0,11);
  if(!starters.length)return null;
  const slots={}; const f=formations['4-3-3'].flat();
  starters.forEach((p,i)=>{if(f[i])slots[f[i]]=p.id});
  return {formation:'4-3-3',slots};
}
function slotHTML(t,pos,lu){
  const p=playerById(t,lu?.slots?.[pos]);
  if(!p)return '<div class="slot"><div class="initial">+</div><b>frei</b><span>'+esc(pos)+'</span></div>';
  return '<div class="slot filled">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="">':'<div class="initial">'+initials(p.name)+'</div>')+'<b>'+esc(p.name)+'</b><span>'+esc(p.pos||p.position||pos)+(p.rating!=null?' · '+esc(p.rating):'')+'</span></div>';
}
function renderXI(t,side){
  const lu=lineupFor(t,side);
  if(!lu)return '<div class="empty">Noch keine Startelf gespeichert.</div>';
  const rows=formations[lu.formation]||formations['4-3-3'];
  return '<div class="formation">'+esc(lu.formation)+'</div><div class="pitch">'+rows.map(r=>'<div class="line">'+r.map(pos=>slotHTML(t,pos,lu)).join('')+'</div>').join('')+'</div>';
}

function sideForTeam(t,home,away){return t&&home&&String(t.id)===String(home.id)?'home':'away';}
function matchLineupSide(t,side){return lineupFor(t,side);}
function saveMatchLineup(side,formation,slots){
  if(!match.lineups)match.lineups={};
  match.lineups[side]={formation,slots:{...slots}};
  saveCurrentMatch();
}
function editLineup(side){
  const t=side==='home'?window.__matchHome:window.__matchAway;
  if(!t){alert('Mannschaft nicht gefunden.');return;}
  const lu=lineupFor(t,side)||{formation:'4-3-3',slots:{}};
  const rows=formations[lu.formation]||formations['4-3-3'];
  const positions=rows.flat();
  const opts=teamPlayers(t).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const used=new Set(Object.values(lu.slots).filter(Boolean).map(String));
  const playerOptions=(current)=>'<option value="">frei</option>'+opts.map(p=>'<option value="'+esc(p.id)+'" '+(String(current)===String(p.id)?'selected':'')+'>'+esc(p.name)+'</option>').join('');
  const fields=positions.map(pos=>'<label style="display:block;font-size:11px;opacity:.7;margin-top:7px">'+esc(pos)+'</label><select data-pos="'+esc(pos)+'">'+playerOptions(lu.slots[pos])+'</select>').join('');
  document.body.insertAdjacentHTML('beforeend','<div class="sheetbg" id="editSheet"><div class="sheet"><button class="btn" type="button" style="float:right" onclick="closeSheet()">✕</button><h2>Startelf bearbeiten</h2><div class="muted" style="margin-top:4px">'+esc(pname(t))+'</div><label style="display:block;font-size:11px;opacity:.7;margin-top:12px">FORMATION</label><select id="editFormation">'+Object.keys(formations).map(f=>'<option value="'+f+'" '+(f===lu.formation?'selected':'')+'>'+f+'</option>').join('')+'</select><div id="slotFields">'+fields+'</div><div class="btnrow"><button class="btn" type="button" onclick="closeSheet()">ABBRECHEN</button><button class="btn primary" type="button" onclick="saveEditedLineup(\''+side+'\')">SPEICHERN</button></div><div class="note">Die Änderung gilt für dieses Spiel und verändert nicht die gespeicherte Vereins-Startelf.</div></div></div>');
}
function saveEditedLineup(side){
  const t=side==='home'?window.__matchHome:window.__matchAway; if(!t)return;
  const f=document.getElementById('editFormation')?.value||'4-3-3';
  const allowed=new Set(formations[f].flat()); const slots={}; const seen=new Set(); let duplicate=false;
  document.querySelectorAll('#slotFields select[data-pos]').forEach(sel=>{const pos=sel.dataset.pos,pid=sel.value;if(!allowed.has(pos)||!pid)return;if(seen.has(String(pid)))duplicate=true;seen.add(String(pid));slots[pos]=pid;});
  if(duplicate){alert('Ein Spieler kann nicht doppelt aufgestellt werden.');return;}
  saveMatchLineup(side,f,slots);closeSheet();renderMatchPage();
}
function closeSheet(){document.getElementById('editSheet')?.remove();}
function activeIds(t,side){const lu=lineupFor(t,side);return new Set(Object.values(lu?.slots||{}).filter(Boolean).map(String));}
function substitutionFormHTML(home,away){
  return '<div class="card"><div class="section-title"><h2>🔄 Ein- & Auswechslungen</h2><span class="muted">'+subEvents().length+'</span></div><div id="subsList">'+subsHTML(home,away)+'</div><div class="subform"><input id="subMinute" type="number" min="0" max="130" inputmode="numeric" placeholder="Min."><select id="subTeam" onchange="refreshSubPlayers()"><option value="home">'+esc(pname(home))+'</option><option value="away">'+esc(pname(away))+'</option></select><select id="subOut"><option value="">Aus</option></select><select id="subIn"><option value="">Ein</option></select><button type="button" onclick="addSubSafe()">＋ AUSWECHSLUNG HINZUFÜGEN</button></div></div>';
}
function subEvents(){return Array.isArray(match.substitutions)?match.substitutions:[]}
function refreshSubPlayers(){
 const side=document.getElementById('subTeam')?.value||'home',t=side==='home'?window.__matchHome:window.__matchAway,lu=lineupFor(t,side);if(!t||!lu)return;
 const out=document.getElementById('subOut'),inn=document.getElementById('subIn'); if(!out||!inn)return;
 const active=Object.values(lu.slots).filter(Boolean).map(String), all=teamPlayers(t);
 out.innerHTML='<option value="">Aus</option>'+active.map(id=>{const p=playerById(t,id);return p?'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>':''}).join('');
 const used=new Set(active); inn.innerHTML='<option value="">Ein</option>'+all.filter(p=>!used.has(String(p.id))).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
}
function addSubSafe(){
 const side=document.getElementById('subTeam')?.value||'home',outId=document.getElementById('subOut')?.value, inId=document.getElementById('subIn')?.value;
 const minute=Math.max(0,Math.min(130,Number(document.getElementById('subMinute')?.value)||0));
 const t=side==='home'?window.__matchHome:window.__matchAway,lu=lineupFor(t,side); if(!t||!lu||!outId||!inId){alert('Bitte Minute, Spieler und Einwechselspieler auswählen.');return;}
 if(String(outId)===String(inId)){alert('Ein- und Auswechselspieler müssen unterschiedlich sein.');return;}
 const slot=Object.keys(lu.slots).find(k=>String(lu.slots[k])===String(outId)); if(!slot){alert('Der ausgewechselte Spieler steht nicht auf dem Feld.');return;}
 lu.slots[slot]=inId; saveMatchLineup(side,lu.formation,lu.slots);
 const ev=subEvents();ev.push({id:'sub_'+Date.now(),type:'sub',team:side,out:outId,in:inId,minute});match.substitutions=ev;match.played=!!match.played;saveCurrentMatch();renderMatchPage();
}
function removeSubSafe(id){match.substitutions=subEvents().filter(e=>String(e.id)!==String(id));saveCurrentMatch();renderMatchPage();}
function subsHTML(home,away){
 const ev=subEvents().slice().sort((a,b)=>Number(a.minute||0)-Number(b.minute||0));
 if(!ev.length)return '<div class="empty">Noch keine Auswechslungen eingetragen.</div>';
 return ev.map(e=>{
   const t=e.team==='home'?home:away, op=playerById(t,e.out), ip=playerById(t,e.in);
   return '<div class="subrow"><b>'+esc(e.minute||0)+"'</b><span>↓ "+esc(op?.name||'Unbekannt')+'</span><span>↑ '+esc(ip?.name||'Unbekannt')+'</span><button class="del" type="button" data-sub="'+esc(e.id)+'">×</button></div>';
 }).join('');
}

function cardEvents(){return Array.isArray(match.cards)?match.cards:[]}
function isKeeper(p){const x=String(p?.position||'').toLowerCase();return x.includes('tw')||x.includes('torwart')||x.includes('goalkeeper')||x==='gk'}
function initialLineup(t,side){
  if(match.lineups&&match.lineups[side])return match.lineups[side];
  return t?.lineup||null;
}
function matchParticipants(t,side){
  const ids=new Set(); const lu=initialLineup(t,side);
  Object.values(lu?.slots||{}).filter(Boolean).forEach(id=>ids.add(String(id)));
  subEvents().filter(e=>e.team===side).sort((a,b)=>Number(a.minute||0)-Number(b.minute||0)).forEach(e=>{if(e.out)ids.add(String(e.out));if(e.in)ids.add(String(e.in));});
  return [...ids].map(id=>playerById(t,id)).filter(Boolean);
}
function cardFormHTML(home,away){
 return '<div class="card"><div class="section-title"><h2>🟨🟥 Karten</h2><span class="muted">'+cardEvents().length+'</span></div><div id="cardsList">'+cardsHTML(home,away)+'</div><div class="goalbox"><div class="goalform"><input id="cardMinute" type="number" min="0" max="130" inputmode="numeric" placeholder="Min."><select id="cardTeam" onchange="refreshCardPlayers()"><option value="home">'+esc(pname(home))+'</option><option value="away">'+esc(pname(away))+'</option></select><select id="cardType"><option value="yellow">🟨 Gelb</option><option value="red">🟥 Rot</option></select></div><select id="cardPlayer" style="width:100%;margin-top:8px;background:#081a4b;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:11px;font-size:12px"><option value="">Spieler</option></select><button class="goalbtn" type="button" onclick="addCardSafe()">＋ KARTE HINZUFÜGEN</button><button class="editxi" type="button" onclick="randomYellowCards()">🎲 ZUFÄLLIGE GELBE KARTEN (0–6 PRO TEAM)</button><div class="note">Für die Zufallsfunktion zählen alle Spieler, die tatsächlich gespielt haben – auch eingewechselte Spieler. Torhüter haben eine deutlich geringere Wahrscheinlichkeit.</div></div></div>';
}
function refreshCardPlayers(){
 const side=document.getElementById('cardTeam')?.value||'home',t=side==='home'?window.__matchHome:window.__matchAway,sel=document.getElementById('cardPlayer'); if(!sel||!t)return;
 sel.innerHTML='<option value="">Spieler</option>'+matchParticipants(t,side).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''))).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+(isKeeper(p)?' 🧤':'')+'</option>').join('');
}
function addCardSafe(){
 const side=document.getElementById('cardTeam')?.value||'home',pid=document.getElementById('cardPlayer')?.value,type=document.getElementById('cardType')?.value||'yellow',minute=Math.max(0,Math.min(130,Number(document.getElementById('cardMinute')?.value)||0));
 const t=side==='home'?window.__matchHome:window.__matchAway,p=playerById(t,pid); if(!t||!p){alert('Bitte Spieler auswählen.');return;}
 const ev=cardEvents(); ev.push({id:'card_'+Date.now(),type:type==='red'?'red':'yellow',team:side,player:pid,minute}); match.cards=ev; match.played=true; saveCurrentMatch(); renderMatchPage();
}
function weightedPick(arr,n){const pool=arr.slice(),out=[]; while(pool.length&&out.length<n){let total=pool.reduce((sum,p)=>sum+(isKeeper(p)?0.08:1),0),r=Math.random()*total,pick=pool[pool.length-1];for(const p of pool){r-=isKeeper(p)?0.08:1;if(r<=0){pick=p;break;}}out.push(pick);pool.splice(pool.indexOf(pick),1);}return out;}
function randomYellowCards(){
 if(!match.played){alert('Bitte erst das Spiel als gespielt markieren bzw. ein Tor/Karte/Auswechslung eintragen.');return;}
 const all=cardEvents(); let added=0;
 [['home',window.__matchHome],['away',window.__matchAway]].forEach(([side,t])=>{
   if(!t)return; const participants=matchParticipants(t,side); const existing=new Set(all.filter(e=>e.type==='yellow'&&e.team===side).map(e=>String(e.player))); const candidates=participants.filter(p=>!existing.has(String(p.id))); const count=Math.min(candidates.length,Math.floor(Math.random()*7)); weightedPick(candidates,count).forEach(p=>{all.push({id:'card_'+Date.now()+'_'+Math.random().toString(36).slice(2),type:'yellow',team:side,player:p.id,minute:Math.floor(1+Math.random()*90)});added++;});
 });
 match.cards=all; match.played=true; saveCurrentMatch(); renderMatchPage(); alert(added+' gelbe Karten zufällig hinzugefügt.');
}
function cardsHTML(home,away){
 const ev=cardEvents().slice().sort((a,b)=>Number(a.minute||0)-Number(b.minute||0)); if(!ev.length)return '<div class="empty">Noch keine Karten eingetragen.</div>';
 return ev.map(e=>{const t=e.team==='home'?home:away,p=playerById(t,e.player),icon=e.type==='red'?'🟥':'🟨';return `<div class="event"><div><b>${esc(e.minute||0)}'</b></div><div>${icon} ${esc(p?.name||'Unbekannt')}<small> · ${esc(pname(t))}</small></div><button class="del" type="button" data-card="${esc(e.id)}">×</button></div>`;}).join('');
}
function removeCardSafe(id){match.cards=cardEvents().filter(e=>String(e.id)!==String(id));saveCurrentMatch();renderMatchPage();}
function gameFlowHTML(home,away){
 const rows=[];
 matchEvents().filter(e=>e.type==='goal').forEach(e=>{const t=e.team==='home'?home:away;rows.push({minute:e.minute||0,html:'⚽ '+esc(playerById(t,e.scorer)?.name||'Unbekannt')+(e.assist?'<small> · Vorlage '+esc(playerById(t,e.assist)?.name||'Unbekannt')+'</small>':'')});});
 cardEvents().forEach(e=>{const t=e.team==='home'?home:away;rows.push({minute:e.minute||0,html:(e.type==='red'?'🟥':'🟨')+' '+esc(playerById(t,e.player)?.name||'Unbekannt')});});
 subEvents().forEach(e=>{const t=e.team==='home'?home:away;rows.push({minute:e.minute||0,html:'🔄 '+esc(playerById(t,e.out)?.name||'Unbekannt')+' → '+esc(playerById(t,e.in)?.name||'Unbekannt')});});
 rows.sort((a,b)=>Number(a.minute)-Number(b.minute)); if(!rows.length)return '<div class="card"><div class="section-title"><h2>📋 Spielverlauf</h2></div><div class="empty">Noch keine Ereignisse.</div></div>';
 return `<div class="card"><div class="section-title"><h2>📋 Spielverlauf</h2><span class="muted">chronologisch</span></div>${rows.map(r=>`<div class="event"><div><b>${esc(r.minute)}'</b></div><div>${r.html}</div></div>`).join('')}</div>`;
}
function saveCurrentMatch(){
  try{
    const data=JSON.parse(localStorage.getItem(KEY)||'{}');
    data.matches=Array.isArray(data.matches)?data.matches:[];
    const i=data.matches.findIndex(x=>String(x.id)===String(match.id));
    if(i>=0)data.matches[i]=match; else data.matches.push(match);
    localStorage.setItem(KEY,JSON.stringify(data));
    s.matches=data.matches;
  }catch(e){}
}
function matchEvents(){return Array.isArray(match.events)?match.events:[]}
function eventPlayers(t){return teamPlayers(t).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))}
function playerSelectHTML(t,placeholder){
  return '<option value="">'+esc(placeholder)+'</option>'+eventPlayers(t).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
}
function goalFormHTML(home,away){
  return '<div class="goalbox"><div class="goalform">'+
    '<input id="goalMinute" type="number" min="0" max="130" inputmode="numeric" placeholder="Min.">'+
    '<select id="goalTeam" onchange="refreshGoalPlayers()"><option value="home">'+esc(pname(home,'Heimteam'))+'</option><option value="away">'+esc(pname(away,'Auswärtsteam'))+'</option></select>'+
    '<select id="goalScorer"><option value="">Torschütze</option></select></div>'+
    '<select id="goalAssist" style="width:100%;margin-top:8px;background:#081a4b;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:11px;font-size:12px"><option value="">Keine Vorlage</option></select>'+
    '<button class="goalbtn" type="button" onclick="addGoalSafe()">＋ TOR HINZUFÜGEN</button></div>';
}
function refreshGoalPlayers(){
  const side=document.getElementById('goalTeam')?.value||'home';
  const t=side==='home'?window.__matchHome:window.__matchAway;
  const sc=document.getElementById('goalScorer'), as=document.getElementById('goalAssist');
  if(!sc||!as)return;
  sc.innerHTML=playerSelectHTML(t,'Torschütze');
  as.innerHTML='<option value="">Keine Vorlage</option>'+eventPlayers(t).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
}
function addGoalSafe(){
  const side=document.getElementById('goalTeam')?.value;
  const scorer=document.getElementById('goalScorer')?.value;
  const assist=document.getElementById('goalAssist')?.value||null;
  const minute=Math.max(0,Math.min(130,Number(document.getElementById('goalMinute')?.value)||0));
  if(!side||!scorer){alert('Bitte Mannschaft und Torschützen auswählen.');return;}
  const ev=matchEvents();
  ev.push({id:'goal_'+Date.now(),type:'goal',team:side,scorer,assist,minute});
  match.events=ev;
  match.played=true;
  match.hg=ev.filter(e=>e.type==='goal'&&e.team==='home').length;
  match.ag=ev.filter(e=>e.type==='goal'&&e.team==='away').length;
  saveCurrentMatch();
  renderMatchPage();
}
function removeGoalSafe(id){
  match.events=matchEvents().filter(e=>String(e.id)!==String(id));
  const goals=match.events.filter(e=>e.type==='goal');
  match.hg=goals.filter(e=>e.team==='home').length;
  match.ag=goals.filter(e=>e.team==='away').length;
  saveCurrentMatch();
  renderMatchPage();
}
function goalsHTML(home,away){
  const ev=matchEvents().filter(e=>e.type==='goal').slice().sort((a,b)=>Number(a.minute||0)-Number(b.minute||0));
  const rows=ev.length?ev.map(e=>{
    const t=e.team==='home'?home:away;
    const p=playerById(t,e.scorer), a=e.assist?playerById(t,e.assist):null;
    return '<div class="event"><div><b>'+esc(e.minute||0)+"'</b></div><div>⚽ "+esc(p?.name||'Unbekannt')+(a?'<small> · Vorlage '+esc(a.name)+'</small>':'')+'</div><button class="del" type="button" data-goal="'+esc(e.id)+'">×</button></div>';
  }).join(''):'<div class="empty">Noch keine Tore eingetragen.</div>';
  return '<div class="card"><div class="section-title"><h2>⚽ Tore & Vorlagen</h2><span class="muted">'+ev.length+' Tore</span></div>'+rows+goalFormHTML(home,away)+'</div>';
}

function back(){history.back()}

function playedParticipants(t,side){return matchParticipants(t,side);}
function matchRatings(){return (match.ratings&&typeof match.ratings==='object')?match.ratings:{};}
function ratingSheetHTML(home,away){
  const existing=matchRatings();
  const rows=[];
  [['home',home],['away',away]].forEach(([side,t])=>{
    playedParticipants(t,side).forEach(p=>{
      const v=existing[p.id]!=null?existing[p.id]:'';
      rows.push('<div class="ratingrow"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(pname(t))+'</div></div><input class="matchRating" data-player="'+esc(p.id)+'" type="number" min="1" max="10" step="0.1" inputmode="decimal" placeholder="—" value="'+esc(v)+'"></div>');
    });
  });
  return '<div class="card"><div class="section-title"><h2>⭐ Spielerbewertungen</h2><span class="muted">1,0–10,0</span></div><div class="note">Bewerte nur Spieler, die in diesem Spiel tatsächlich gespielt haben. Die Durchschnittswerte werden nach der Spielbestätigung in die Statistiken übernommen.</div><div style="margin-top:8px">'+(rows.length?rows.join(''):'<div class="empty">Noch keine Spieler in diesem Spiel.</div>')+'</div><button class="goalbtn" type="button" onclick="saveRatings()">⭐ BEWERTUNGEN SPEICHERN</button></div>';
}
function saveRatings(){
  const ratings={...matchRatings()};
  document.querySelectorAll('.matchRating[data-player]').forEach(inp=>{const v=Number(inp.value);if(Number.isFinite(v)&&v>=1&&v<=10)ratings[inp.dataset.player]=Math.round(v*10)/10;});
  match.ratings=ratings;saveCurrentMatch();renderMatchPage();alert('Bewertungen gespeichert.');
}
function saveMatchDate(){
  match.date=document.getElementById('matchDate')?.value||'';
  match.time=document.getElementById('matchTime')?.value||'';
  saveCurrentMatch();renderMatchPage();
}
function buildContribution(home,away){
  const participants=[...playedParticipants(home,'home'),...playedParticipants(away,'away')];
  const ratings=matchRatings();
  const goals=matchEvents().filter(e=>e.type==='goal');
  const goalMap={},assistMap={};
  goals.forEach(e=>{if(e.scorer)goalMap[String(e.scorer)]=(goalMap[String(e.scorer)]||0)+1;if(e.assist)assistMap[String(e.assist)]=(assistMap[String(e.assist)]||0)+1;});
  return {participants:participants.map(p=>({id:String(p.id),team:String(p.team),goals:Number(goalMap[String(p.id)])||0,assists:Number(assistMap[String(p.id)])||0,apps:1,rating:ratings[p.id]!=null?Number(ratings[p.id]):null})),matchId:String(match.id)};
}
function adjustPlayerContribution(gp,c,sign){
  gp.goals=Math.max(0,(Number(gp.goals)||0)+sign*(Number(c.goals)||0));
  gp.assists=Math.max(0,(Number(gp.assists)||0)+sign*(Number(c.assists)||0));
  gp.apps=Math.max(0,(Number(gp.apps)||0)+sign*(Number(c.apps)||0));
  gp.ratingSum=Math.max(0,(Number(gp.ratingSum)||0)+sign*(c.rating!=null?Number(c.rating):0));
  gp.ratingCount=Math.max(0,(Number(gp.ratingCount)||0)+sign*(c.rating!=null?1:0));
  gp.ratingAvg=gp.ratingCount?gp.ratingSum/gp.ratingCount:0;
  gp.careerByTeam=gp.careerByTeam||{};
  gp.careerByTeam[gp.team]=gp.careerByTeam[gp.team]||{goals:0,assists:0,apps:0,ratingSum:0,ratingCount:0};
  const cc=gp.careerByTeam[gp.team];
  cc.goals=Math.max(0,(Number(cc.goals)||0)+sign*(Number(c.goals)||0));
  cc.assists=Math.max(0,(Number(cc.assists)||0)+sign*(Number(c.assists)||0));
  cc.apps=Math.max(0,(Number(cc.apps)||0)+sign*(Number(c.apps)||0));
  cc.ratingSum=Math.max(0,(Number(cc.ratingSum)||0)+sign*(c.rating!=null?Number(c.rating):0));
  cc.ratingCount=Math.max(0,(Number(cc.ratingCount)||0)+sign*(c.rating!=null?1:0));
  cc.ratingAvg=cc.ratingCount?cc.ratingSum/cc.ratingCount:0;
}
function applyContribution(data,contribution,sign){
  (contribution?.participants||[]).forEach(c=>{const gp=(data.players||[]).find(x=>String(x.id)===String(c.id));if(gp)adjustPlayerContribution(gp,c,sign);});
}
function confirmMatch(){
  const wasConfirmed=!!match.confirmed;
  const home=window.__matchHome,away=window.__matchAway;
  if(!home||!away){alert('Teams konnten nicht gefunden werden.');return;}
  const participants=[...playedParticipants(home,'home'),...playedParticipants(away,'away')];
  if(!participants.length){alert('Es wurde noch keine Startelf bzw. kein Einsatz erfasst.');return;}
  const ratings=matchRatings();
  const missing=participants.filter(p=>ratings[p.id]==null);
  if(missing.length){if(!confirm('Für '+missing.length+' Spieler fehlt noch eine Bewertung. Trotzdem bestätigen?'))return;}
  const data=JSON.parse(localStorage.getItem(KEY)||'{}');
  data.players=Array.isArray(data.players)?data.players:[];
  if(match.confirmed){
    if(match.appliedContribution)applyContribution(data,match.appliedContribution,-1);
    else applyContribution(data,buildContribution(home,away),-1);
  }
  const contribution=buildContribution(home,away);
  applyContribution(data,contribution,1);
  const idx=(data.matches||[]).findIndex(x=>String(x.id)===String(match.id));
  match.confirmed=true;match.played=true;match.appliedContribution=contribution;
  if(idx>=0)data.matches[idx]=match;else{data.matches=data.matches||[];data.matches.push(match)}
  localStorage.setItem(KEY,JSON.stringify(data));
  s.players=data.players;s.matches=data.matches;
  alert(wasConfirmed?'Spiel aktualisiert. Die Statistiken wurden neu berechnet.':'Spiel bestätigt. Die Statistiken wurden aktualisiert.');
  renderMatchPage();
}
function confirmationHTML(){
  if(match.confirmed)return '<div class="card"><div class="section-title"><h2>✏️ Spiel aktualisieren</h2><span class="muted">Statistik wird neu berechnet</span></div><div class="note">Du kannst das Spiel jederzeit weiter bearbeiten. Mit dem Button werden die alten Statistikwerte dieses Spiels entfernt und anhand des aktuellen Spielstands neu berechnet. So entstehen keine doppelten Einsätze, Tore, Vorlagen oder Bewertungen.</div><button class="goalbtn" type="button" onclick="confirmMatch()">🔄 SPIEL AKTUALISIEREN & STATISTIK NEU BERECHNEN</button></div>';
  return '<div class="card"><div class="section-title"><h2>Spiel abschließen</h2><span class="muted">letzter Schritt</span></div><div class="note">Erst nach der Bestätigung werden Tore, Vorlagen, Einsätze und Bewertungen in die Statistiken übernommen.</div><button class="goalbtn" type="button" onclick="confirmMatch()">✅ SPIEL BESTÄTIGEN & STATISTIK AKTUALISIEREN</button></div>';
}
function renderMatchPage(){
  if(!match){document.getElementById('app').innerHTML='<div class="card"><h2>Spiel nicht gefunden</h2><div class="actions"><button class="btn" type="button" onclick="back()">← Zurück</button></div></div>';return;}
  const home=team(match.home), away=team(match.away);
  window.__matchHome=home; window.__matchAway=away;
  const homeFallback=match.homeName||match.home_team||q.get('home')||'Heimteam';
  const awayFallback=match.awayName||match.away_team||q.get('away')||'Auswärtsteam';
  const played=!!match.played;
  const rd=match.round??match.matchday??q.get('round')??'—';
  document.getElementById('app').innerHTML=
   '<div class="top"><button class="back" type="button" onclick="back()">‹</button><div><h1>SPIEL</h1><div class="muted">SPIELTAG '+esc(rd)+'</div></div></div>'+ 
   '<div class="card"><div class="hero"><div class="team">'+crest(home)+'<div>'+esc(pname(home,homeFallback))+'</div></div><div class="score">'+(played?esc(match.hg??0)+' : '+esc(match.ag??0):'– : –')+'</div><div class="team">'+crest(away)+'<div>'+esc(pname(away,awayFallback))+'</div></div></div><div class="note">'+(played?'Endergebnis':'Noch nicht gespielt')+(match.confirmed?' · bestätigt':'')+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><input id="matchDate" type="date" value="'+esc(match.date||'')+'" style="width:100%;background:#081a4b;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:11px"><input id="matchTime" type="time" value="'+esc(match.time||'')+'" style="width:100%;background:#081a4b;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:11px"></div><button class="editxi" type="button" onclick="saveMatchDate()">📅 DATUM & UHRZEIT SPEICHERN</button></div>'+ 
   '<div class="card"><div class="section-title"><h2>'+esc(pname(home,homeFallback))+' – Startelf</h2><span class="muted">'+esc(lineupFor(home,'home')?.formation||'—')+'</span></div>'+renderXI(home,'home')+'<button class="editxi" type="button" onclick="editLineup(\'home\')">✎ STARTELF BEARBEITEN</button></div>'+ 
   '<div class="card"><div class="section-title"><h2>'+esc(pname(away,awayFallback))+' – Startelf</h2><span class="muted">'+esc(lineupFor(away,'away')?.formation||'—')+'</span></div>'+renderXI(away,'away')+'<button class="editxi" type="button" onclick="editLineup(\'away\')">✎ STARTELF BEARBEITEN</button></div>'+ 
   goalsHTML(home,away)+substitutionFormHTML(home,away)+cardFormHTML(home,away)+gameFlowHTML(home,away)+ratingSheetHTML(home,away)+confirmationHTML();
  refreshGoalPlayers();
  refreshSubPlayers();
}
renderMatchPage();
document.addEventListener('click',function(e){const b=e.target.closest('[data-goal]');if(b){removeGoalSafe(b.getAttribute('data-goal'));return;}const sub=e.target.closest('[data-sub]');if(sub){removeSubSafe(sub.getAttribute('data-sub'));return;}const c=e.target.closest('[data-card]');if(c)removeCardSafe(c.getAttribute('data-card'));});
</script></body></html>
