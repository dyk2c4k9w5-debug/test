<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081a4b">
<title>Startelf – Liga Manager</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#071640;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px 14px 50px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:44px;height:44px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff12;color:#fff;font-size:28px}h1,h2{margin:0}h1{font-size:23px}h2{font-size:18px}.muted{opacity:.62;font-size:12px}.card{background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:14px;margin:10px 0}.hero{display:flex;align-items:center;gap:12px}.logo{width:60px;height:60px;border-radius:16px;background:#ffffff12;display:grid;place-items:center;font-size:22px;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.select{width:100%;padding:12px;border-radius:11px;border:1px solid #ffffff25;background:#061338;color:#fff;font:inherit}.formation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.formation{border:1px solid #ffffff20;background:#ffffff0b;color:#fff;border-radius:10px;padding:10px 5px;font-size:11px;font-weight:800}.formation.active{background:#2457ff;border-color:#2457ff}.pitch{background:linear-gradient(180deg,#164d37,#0f402d);border:1px solid #ffffff25;border-radius:18px;padding:14px 8px;margin-top:12px;position:relative;overflow:hidden}.pitch:before{content:"";position:absolute;inset:8% 9%;border:1px solid #ffffff45;border-radius:8px;pointer-events:none}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;border:1px solid #ffffff45;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.line{display:flex;justify-content:center;gap:7px;position:relative;z-index:1;margin:9px 0}.slot{width:72px;min-height:67px;border:1px solid #ffffff45;background:#ffffff18;color:#fff;border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.slot.filled{background:#071b43;border-color:#ffffff55}.slot img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#ffffff15}.slot .initial{width:34px;height:34px;border-radius:50%;background:#ffffff15;display:grid;place-items:center;font-size:10px;font-weight:900}.slot b{font-size:9px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot span{font-size:8px;opacity:.62}.hint{font-size:10px;opacity:.58;line-height:1.4;margin-top:8px}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px}.overall{font-size:25px;font-weight:900}.primary,.secondary{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:13px;margin-top:9px}.primary{background:#2457ff;color:#fff}.secondary{background:#ffffff12;color:#fff;border:1px solid #ffffff20}.sheetbg{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:20}.sheet{width:100%;max-width:560px;margin:auto;background:#0c1c4b;border:1px solid #ffffff20;border-bottom:0;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}.close{float:right;background:#ffffff12;border:1px solid #ffffff20;color:#fff;border-radius:9px;padding:7px 10px}.players{display:grid;gap:7px;margin-top:12px}.player{display:flex;align-items:center;gap:10px;border:1px solid #ffffff18;background:#ffffff09;border-radius:12px;padding:9px;text-align:left;color:#fff;width:100%}.player img,.player .initial{width:44px;height:44px;border-radius:11px;object-fit:cover;background:#ffffff15;display:grid;place-items:center;font-weight:900;font-size:11px;flex:none}.player-main{min-width:0;flex:1}.player-main b{font-size:13px}.player-main div{font-size:10px;opacity:.62;margin-top:2px}.rating{font-weight:900}.empty{opacity:.6;text-align:center;padding:18px}.remove{font-size:9px;opacity:.6}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px}
@media(max-width:370px){.slot{width:64px}.slot b{max-width:60px}.formation-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
const KEY="liga-manager-v5";
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.teams)){if(!Array.isArray(o.players))o.players=[];if(!Array.isArray(o.tournaments))o.tournaments=[];return o}}}catch(e){}try{const raw=sessionStorage.getItem("lmTeamState");if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.teams)){if(!Array.isArray(o.players))o.players=[];if(!Array.isArray(o.tournaments))o.tournaments=[];return o}}}catch(e){}return {teams:[],players:[]};}
let s=load();
const id=new URLSearchParams(location.search).get("id");
const team=()=>s.teams.find(t=>String(t.id)===String(id));
const players=()=>s.players.filter(p=>String(p.team)===String(id));
const init=n=>String(n||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{localStorage.setItem(KEY,JSON.stringify(s));try{sessionStorage.setItem("lmTeamState",JSON.stringify(s))}catch(e){}};
const formations={
 "4-4-2":[[{id:"gk",label:"TW"}],[{id:"lb",label:"LV"},{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"rb",label:"RV"}],[{id:"lm",label:"LM"},{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"rm",label:"RM"}],[{id:"st1",label:"ST"},{id:"st2",label:"ST"}]],
 "4-3-3":[[{id:"gk",label:"TW"}],[{id:"lb",label:"LV"},{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"rb",label:"RV"}],[{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"cm3",label:"ZM"}],[{id:"lw",label:"LA"},{id:"st1",label:"ST"},{id:"rw",label:"RA"}]],
 "4-2-3-1":[[{id:"gk",label:"TW"}],[{id:"lb",label:"LV"},{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"rb",label:"RV"}],[{id:"dm1",label:"DM"},{id:"dm2",label:"DM"}],[{id:"lw",label:"LA"},{id:"om",label:"OM"},{id:"rw",label:"RA"}],[{id:"st1",label:"ST"}]],
 "4-1-4-1":[[{id:"gk",label:"TW"}],[{id:"lb",label:"LV"},{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"rb",label:"RV"}],[{id:"dm",label:"DM"}],[{id:"lm",label:"LM"},{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"rm",label:"RM"}],[{id:"st1",label:"ST"}]],
 "3-5-2":[[{id:"gk",label:"TW"}],[{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"cb3",label:"IV"}],[{id:"lm",label:"LM"},{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"cm3",label:"ZM"},{id:"rm",label:"RM"}],[{id:"st1",label:"ST"},{id:"st2",label:"ST"}]],
 "3-4-3":[[{id:"gk",label:"TW"}],[{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"cb3",label:"IV"}],[{id:"lm",label:"LM"},{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"rm",label:"RM"}],[{id:"lw",label:"LA"},{id:"st1",label:"ST"},{id:"rw",label:"RA"}]],
 "5-3-2":[[{id:"gk",label:"TW"}],[{id:"lb",label:"LV"},{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"cb3",label:"IV"},{id:"rb",label:"RV"}],[{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"cm3",label:"ZM"}],[{id:"st1",label:"ST"},{id:"st2",label:"ST"}]],
 "5-4-1":[[{id:"gk",label:"TW"}],[{id:"lb",label:"LV"},{id:"cb1",label:"IV"},{id:"cb2",label:"IV"},{id:"cb3",label:"IV"},{id:"rb",label:"RV"}],[{id:"lm",label:"LM"},{id:"cm1",label:"ZM"},{id:"cm2",label:"ZM"},{id:"rm",label:"RM"}],[{id:"st1",label:"ST"}]]
};
let formation=team()?.lineup?.formation||"4-3-3";
let lineup=team()?.lineup?.slots?{...team().lineup.slots}:{};
let selectedSlot=null;
function normalize(){const t=team();if(!t)return;const valid=new Set(players().map(p=>String(p.id)));Object.keys(lineup).forEach(k=>{if(!valid.has(String(lineup[k])))delete lineup[k]});}
normalize();
function back(){location.href=`team.html?id=${encodeURIComponent(String(id))}`;}
function setFormation(f){formation=f;const allowed=new Set(formations[f].flat().map(x=>x.id));Object.keys(lineup).forEach(k=>{if(!allowed.has(k))delete lineup[k]});render();}
function slotPlayer(pos){const pid=lineup[pos];return players().find(p=>String(p.id)===String(pid));}
function overall(){const ids=Object.values(lineup).filter(Boolean);if(ids.length!==11)return "—";const vals=ids.map(x=>Number(players().find(p=>String(p.id)===String(x))?.rating)||0);if(vals.some(v=>!v))return "—";return (vals.reduce((a,b)=>a+b,0)/11).toFixed(2);}
function chooseSlot(pos,label){selectedSlot=pos;const ps=players();const used=new Set(Object.entries(lineup).filter(([k])=>k!==pos).map(([,v])=>String(v)));
 document.body.insertAdjacentHTML("beforeend",`<div class="sheetbg" id="pick"><div class="sheet"><button class="close" type="button" onclick="closePick()">✕</button><h2>Spieler für ${esc(label||pos)}</h2><div class="hint">Wähle einen Spieler aus dem Kader. Ein Spieler kann nur einmal aufgestellt werden.</div>${lineup[pos]?`<button class="secondary" type="button" onclick="clearSlot()">POSITION LEEREN</button>`:""}<div class="players">${ps.length?ps.map(p=>{const usedHere=used.has(String(p.id));return `<button class="player" type="button" ${usedHere?'disabled style="opacity:.35"':''} onclick="assign('${String(p.id).replace(/'/g,"\'")}')">${p.photo?`<img src="${p.photo}" alt="">`:`<div class="initial">${init(p.name)}</div>`}<div class="player-main"><b>${esc(p.name)}</b><div>${esc(p.pos||"—")}</div></div><div class="rating">${p.rating||"—"}</div></button>`}).join(""):`<div class="empty">Noch keine Spieler im Kader.</div>`}</div></div></div>`);}
function assign(pid){if(selectedSlot==null)return;const used=Object.entries(lineup).some(([k,v])=>k!==selectedSlot&&String(v)===String(pid));if(used)return;lineup[selectedSlot]=pid;closePick();render();}
function clearSlot(){if(selectedSlot!=null)delete lineup[selectedSlot];closePick();render();}
function closePick(){document.getElementById("pick")?.remove();selectedSlot=null;}
function persist(){const t=team();if(!t)return;const ids=Object.values(lineup).filter(Boolean).map(String);t.lineup={formation,slots:{...lineup}};s.players.forEach(p=>{if(String(p.team)===String(id))p.starter=ids.includes(String(p.id));});save();alert("Startelf gespeichert.");}
function slotHTML(slot){const pos=slot.id,label=slot.label,p=slotPlayer(pos);return `<button class="slot ${p?'filled':''}" type="button" onclick="chooseSlot('${pos.replace(/'/g,"\\'")}','${label}')">${p?(p.photo?`<img src="${p.photo}" alt="">`:`<div class="initial">${init(p.name)}</div>`):`<div style="font-size:21px;opacity:.65">＋</div>`}<b>${p?esc(p.name):label}</b><span>${p?esc(p.pos||label):"Spieler wählen"}</span></button>`;}
function render(){const app=document.getElementById("app"),t=team();if(!t){app.innerHTML='<div class="card empty">Team nicht gefunden.</div>';return;}const logo=t.logo?`<img src="${t.logo}">`:init(t.name);app.innerHTML=`<div class="top"><button class="back" type="button" onclick="back()">‹</button><div><h1>STARTELF</h1><div class="muted">${esc(t.name)}</div></div></div><div class="card"><div class="hero"><div class="logo">${logo}</div><div><h2>${esc(t.name)}</h2><div class="muted">Aufstellung auswählen und Spieler einsetzen</div></div></div></div><div class="card"><div class="sectionhead"><h2>AUFSTELLUNG</h2><span class="muted">${Object.keys(lineup).length} / 11</span></div><div class="formation-grid">${Object.keys(formations).map(f=>`<button class="formation ${formation===f?'active':''}" type="button" onclick="setFormation('${f}')">${f}</button>`).join("")}</div><div class="pitch">${formations[formation].map(row=>`<div class="line">${row.map(slot=>slotHTML(slot)).join("")}</div>`).join("")}</div><div class="hint">Tippe auf eine Position und wähle anschließend einen Spieler aus deinem Kader.</div></div><div class="card"><div class="summary"><div><div class="muted">GESAMTSTÄRKE</div><div class="overall">${overall()}</div></div><div style="text-align:right"><div class="muted">STARTELF</div><b>${Object.keys(lineup).length} / 11</b></div></div>${Object.keys(lineup).length===11?'<div class="hint">Die Gesamtstärke entspricht dem Durchschnitt der 11 Overall-Werte.</div>':'<div class="hint">Eine Gesamtstärke wird erst angezeigt, wenn alle 11 Positionen besetzt sind.</div>'}<button class="primary" type="button" onclick="persist()">STARTELF SPEICHERN</button><button class="secondary" type="button" onclick="back()">ZURÜCK ZUM TEAM</button></div>`;}
render();
</script>
</body>
</html>
