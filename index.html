<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172d78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Turnier</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
body{background:radial-gradient(circle at 50% -10%,#536fe0 0,#253e9a 27%,#10245e 58%,#08163f 100%);background-attachment:fixed}
button,input,select{font:inherit}button{color:inherit}.wrap{max-width:560px;margin:auto;min-height:100vh;padding:calc(8px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));}
.head{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff55}.title{font-size:21px;font-weight:800}.season{border:1px solid #ffffff66;background:#ffffff14;border-radius:20px;padding:9px 13px;font-weight:700}.gear{background:none;border:0;font-size:21px;margin-left:5px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);height:45px;border-bottom:1px solid #ffffff55}.tabs button{background:none;border:0;font-weight:800;font-size:13px;opacity:.82;position:relative}.tabs button.active{opacity:1;color:#fff}.tabs button.active:after{content:"";position:absolute;bottom:-1px;left:22%;right:22%;height:3px;background:#ff285d;border-radius:3px}
.subtabs{display:flex;align-items:center;gap:22px;height:42px;border-bottom:1px solid #ffffff2b;overflow:hidden;white-space:nowrap}.subtabs button{background:none;border:0;padding:0;font-size:12px;font-weight:800;opacity:.82}.subtabs button.active{color:#fff}.subtabs .blue{color:#61a2ff}.round{margin-left:auto;display:flex;align-items:center;gap:8px}.round button{width:28px;height:28px;border:1px solid #ffffff35;border-radius:50%;background:#ffffff13;font-size:18px;line-height:1}
.list{margin-top:3px}.match{display:grid;grid-template-columns:54px 1fr 30px;border-bottom:1px solid #ffffff20;min-height:47px;align-items:center;font-size:13px}.time{font-size:11px;opacity:.7}.teams div{line-height:19px}.score{text-align:right;font-weight:850;font-size:16px}.table{margin-top:8px}.tr{display:grid;grid-template-columns:27px 1fr 27px 38px 35px;align-items:center;min-height:39px;border-bottom:1px solid #ffffff1c;font-size:12px}.tr.headrow{min-height:27px;font-size:9px;opacity:.65;font-weight:800}.team{display:flex;align-items:center;gap:6px;min-width:0}.logo{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;border:1px solid #ffffff55;font-size:9px;font-weight:900;flex:none}.form{display:flex;gap:3px}.f{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900}.w{background:#55cf77}.l{background:#f03354}.d{background:#d7d8d9;color:#555}.p{text-align:right;font-weight:900}.scorer{display:grid;grid-template-columns:26px 30px 1fr 54px 28px;align-items:center;min-height:45px;border-bottom:1px solid #ffffff1c;font-size:13px}.rank{font-weight:800}.picon{width:27px;height:27px;border-radius:50%;border:1px solid #ffffff75;display:grid;place-items:center;font-size:9px;font-weight:800;overflow:hidden}.picon img{width:100%;height:100%;object-fit:cover}.statline{opacity:.75;font-size:11px;text-align:right}.goals{font-size:16px;font-weight:900;text-align:right}.empty{text-align:center;padding:45px 15px;opacity:.7}.fab{position:fixed;right:20px;bottom:24px;width:52px;height:52px;border-radius:50%;border:0;background:#ff285d;box-shadow:0 7px 20px #0005;font-size:27px}.sheetbg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:10}.sheet{width:100%;max-width:560px;margin:auto;background:#122967;border:1px solid #ffffff2b;border-radius:24px 24px 0 0;padding:18px 15px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h2{margin:0 0 12px;font-size:19px}.sheet input,.sheet select{width:100%;background:#081a4b;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:12px;margin:4px 0 10px}.sheet label{font-size:11px;opacity:.7}.sheet button.primary{width:100%;padding:12px;border:0;border-radius:12px;background:#ff285d;font-weight:900;margin-top:4px}.close{float:right;background:#ffffff15;border:0;border-radius:10px;padding:7px 10px}.photo{width:70px;height:70px;border-radius:18px;object-fit:cover;background:#ffffff18}
@media(min-width:700px){.wrap{padding-left:20px;padding-right:20px}}
</style>
</head>
<body><div id="root"></div>
<script>
const KEY="liga-manager-v5";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{
 league:{name:"Turnier",season:"2026/27"},
 teams:[
  {id:"a",name:"FC Beispiel"},
  {id:"b",name:"United FC"},
  {id:"c",name:"City FC"},
  {id:"d",name:"SV Berlin"},
  {id:"e",name:"SC Köln"},
  {id:"f",name:"Rheinland"},
  {id:"g",name:"Nord FC"},
  {id:"h",name:"Westfalen"}
 ],
 players:[
  {id:"p1",team:"a",name:"Lukas Müller",pos:"ST",rating:87,value:42,goals:19,assists:10,apps:24,photo:""},
  {id:"p2",team:"b",name:"Jonas Weber",pos:"ST",rating:85,value:35,goals:15,assists:8,apps:22,photo:""},
  {id:"p3",team:"c",name:"Max Schneider",pos:"OM",rating:84,value:31,goals:13,assists:10,apps:23,photo:""},
  {id:"p4",team:"d",name:"Felix Bauer",pos:"ST",rating:82,value:27,goals:11,assists:7,apps:21,photo:""}
 ],
 matches:[
  {id:"m1",round:1,date:"23. Mai",time:"15:30",home:"a",away:"b",hg:3,ag:0,played:true},
  {id:"m2",round:1,date:"23. Mai",time:"15:30",home:"c",away:"d",hg:2,ag:2,played:true},
  {id:"m3",round:1,date:"24. Mai",time:"15:30",home:"e",away:"f",hg:1,ag:0,played:true},
  {id:"m4",round:1,date:"24. Mai",time:"15:30",home:"g",away:"h",hg:1,ag:1,played:true}
 ]};
let tab="groups", sub="scorers", round=1;
const $=x=>document.querySelector(x), save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const team=id=>s.teams.find(x=>x.id===id)?.name||"—";
const init=n=>(n||"?").split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();
function header(){
return `<div class="head"><div class="title">${s.league.name}</div><div><select class="season" onchange="s.league.season=this.value;save();render()"><option>${s.league.season}</option><option>2027/28</option><option>2028/29</option></select><button class="gear" onclick="settings()">⚙︎</button></div></div>
<div class="tabs">${["preview","groups","matches","stats"].map(x=>`<button class="${tab===x?"active":""}" onclick="tab='${x}';render()">${x.toUpperCase()}</button>`).join("")}</div>`;
}
function render(){document.body.scrollTop=0;$("#root").innerHTML=`<div class="wrap">${header()}${tab==="preview"?preview():tab==="groups"?groups():tab==="matches"?matches():stats()}</div>${tab!=="preview"?'<button class="fab" onclick="quickAdd()">＋</button>':""}`}
function preview(){return `<div class="empty"><div style="font-size:48px;margin-bottom:12px">🏆</div><h2 style="margin:0 0 7px">Willkommen im ${s.league.name}</h2><div>Verwalte deine Saison, Teams, Spieler und Ergebnisse.</div><button style="margin-top:18px;background:#ff285d;border:0;border-radius:12px;padding:12px 18px;font-weight:900" onclick="tab='groups';render()">Zur Tabelle</button></div>`}
function groups(){
let rows=s.teams.map(t=>{let played=s.matches.filter(m=>m.played&&(m.home===t.id||m.away===t.id)),pts=0,gf=0,ga=0,form=[];played.forEach(m=>{let h=m.home===t.id, a=h?m.hg:m.ag,b=h?m.ag:m.hg;gf+=a;ga+=b;let r=a>b?3:a===b?1:0;pts+=r;form.push(a>b?"W":a===b?"D":"L")});return{t,played,pts,gf,ga,form}}).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
return `<div class="subtabs"><button class="active">PHASE</button><button>FORM</button><button>ALLE</button><button>SPIELE</button></div><div class="table"><div class="tr headrow"><div>#</div><div>TEAM</div><div>SP</div><div>FORM</div><div>P</div></div>${rows.map((r,i)=>`<div class="tr"><div>${i+1}</div><div class="team"><div class="logo">${init(r.t.name)}</div><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.t.name}</span></div><div>${r.played.length}</div><div class="form">${r.form.slice(-5).map(x=>`<span class="f ${x==="W"?"w":x==="L"?"l":"d"}">${x}</span>`).join("")}</div><div class="p">${r.pts}</div></div>`).join("")}</div>`}
function matches(){
let ms=s.matches.filter(m=>m.round===round);return `<div class="subtabs"><button class="active">PHASE</button><button>NACH DATUM</button><button class="blue">NACH RUNDE</button><div class="round"><button onclick="round=Math.max(1,round-1);render()">‹</button><b>${round}</b><button onclick="round++;render()">›</button></div></div><div class="list">${ms.length?ms.map(m=>`<div class="match"><div class="time">${m.time||"time"}</div><div class="teams"><div>${team(m.home)}</div><div>${team(m.away)}</div></div><div class="score">${m.played?`${m.hg}<br>${m.ag}`:"–<br>–"}</div></div>`).join(""):`<div class="empty">Keine Spiele in Runde ${round}.</div>`}</div>`}
function stats(){
let arr=[...s.players].sort((a,b)=>(b.goals||0)-(a.goals||0));return `<div class="subtabs"><button class="${sub==="scorers"?"active":""}" onclick="sub='scorers';render()">SCORERS</button><button class="${sub==="assists"?"active":""}" onclick="sub='assists';render()">ASSISTS</button></div><div class="list">${arr.map((p,i)=>`<div class="scorer" onclick="editPlayer('${p.id}')"><div class="rank">${i+1}</div><div class="picon">${p.photo?`<img src="${p.photo}">`:init(p.name)}</div><div><b>${p.name}</b><div style="font-size:10px;opacity:.65">${team(p.team)} · ${p.pos}</div></div><div class="statline">(${p.goals||0}/${p.assists||0})</div><div class="goals">${sub==="scorers"?p.goals||0:p.assists||0}</div></div>`).join("")}</div>`}
function modal(body){document.body.insertAdjacentHTML("beforeend",`<div class="sheetbg" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button>${body}</div></div>`)}
function closeModal(){$("#modal")?.remove()}
function settings(){modal(`<h2>Turnier verwalten</h2><label>Turniername</label><input id="ln" value="${s.league.name}"><label>Saison</label><input id="ls" value="${s.league.season}"><button class="primary" onclick="s.league.name=$('#ln').value||'Turnier';s.league.season=$('#ls').value||'2026/27';save();closeModal();render()">Speichern</button><hr style="border:0;border-top:1px solid #ffffff22;margin:18px 0"><button class="primary" onclick="newTeam()">＋ Team hinzufügen</button><button class="primary" onclick="newPlayer()">＋ Spieler hinzufügen</button><button class="primary" onclick="newMatch()">＋ Spiel hinzufügen</button>`)}
function quickAdd(){settings()}
function newTeam(){modal(`<h2>Neues Team</h2><label>Teamname</label><input id="tn" placeholder="z. B. Bayern München"><button class="primary" onclick="s.teams.push({id:Date.now()+'',name:$('#tn').value||'Neues Team'});save();closeModal();render()">Team erstellen</button>`)}
function opts(sel=""){return s.teams.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${t.name}</option>`).join("")}
function newPlayer(){modal(`<h2>Neuer Spieler</h2><label>Name</label><input id="pn" placeholder="Vor- und Nachname"><label>Team</label><select id="pt">${opts()}</select><label>Position</label><input id="pp" placeholder="ST, ZM, TW ..."><label>Rating</label><input id="pr" type="number" value="75" min="1" max="99"><label>Marktwert (Mio.)</label><input id="pv" type="number" value="10" step=".1"><label>Foto</label><input id="ph" type="file" accept="image/*"><button class="primary" onclick="addPlayer()">Spieler speichern</button>`)}
function addPlayer(){let f=$("#ph").files[0],done=photo=>{s.players.push({id:Date.now()+'',team:$("#pt").value,name:$("#pn").value||"Neuer Spieler",pos:$("#pp").value||"—",rating:+$("#pr").value||0,value:+$("#pv").value||0,goals:0,assists:0,apps:0,photo:photo||""});save();closeModal();tab="stats";render()};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}
function editPlayer(pid){let p=s.players.find(x=>x.id===pid);modal(`<h2>${p.name}</h2>${p.photo?`<img class="photo" src="${p.photo}">`:""}<label>Team</label><select id="pt">${opts(p.team)}</select><label>Position</label><input id="pp" value="${p.pos}"><label>Rating</label><input id="pr" type="number" value="${p.rating}"><label>Marktwert (Mio.)</label><input id="pv" type="number" step=".1" value="${p.value}"><label>Tore</label><input id="pg" type="number" value="${p.goals||0}"><label>Assists</label><input id="pa" type="number" value="${p.assists||0}"><label>Einsätze</label><input id="app" type="number" value="${p.apps||0}"><label>Foto ändern</label><input id="ph" type="file" accept="image/*"><button class="primary" onclick="updatePlayer('${pid}')">Speichern</button>`)}
function updatePlayer(pid){let p=s.players.find(x=>x.id===pid),f=$("#ph").files[0],done=photo=>{p.team=$("#pt").value;p.pos=$("#pp").value;p.rating=+$("#pr").value||0;p.value=+$("#pv").value||0;p.goals=+$("#pg").value||0;p.assists=+$("#pa").value||0;p.apps=+$("#app").value||0;if(photo)p.photo=photo;save();closeModal();render()};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}
function newMatch(){modal(`<h2>Neues Spiel</h2><label>Heimteam</label><select id="mh">${opts()}</select><label>Auswärtsteam</label><select id="ma">${opts()}</select><label>Runde</label><input id="mr" type="number" value="${round}" min="1"><label>Datum</label><input id="md" placeholder="23. Mai"><label>Uhrzeit</label><input id="mt" value="15:30"><button class="primary" onclick="addMatch()">Spiel speichern</button>`)}
function addMatch(){if($("#mh").value===$("#ma").value)return alert("Bitte zwei verschiedene Teams wählen.");s.matches.push({id:Date.now()+'',round:+$("#mr").value||1,date:$("#md").value,time:$("#mt").value,home:$("#mh").value,away:$("#ma").value,hg:0,ag:0,played:false});save();closeModal();tab="matches";round=+$("#mr").value||1;render()}
render();
</script></body></html>
