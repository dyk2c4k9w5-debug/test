<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Liga Manager</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6b7280;--accent:#007aff;--line:#e5e5ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:var(--text)}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px calc(80px + env(safe-area-inset-bottom))}
header{padding:22px 4px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:32px;margin:0;font-weight:800}h2{font-size:23px;margin:22px 0 10px}.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
button,.btn{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:650;background:var(--accent);color:white}
button.secondary{background:#e9e9ee;color:#111}button.danger{background:#ff3b30}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center;background:#f2f2f7;border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;margin:5px 0 10px}
label{font-size:13px;color:var(--muted);display:block;margin-top:6px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px;z-index:5}
.nav button{background:transparent;color:#555;padding:9px 15px}.nav button.active{color:var(--accent)}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#eaf2ff;display:grid;place-items:center;font-weight:800;color:var(--accent);flex:none}
.rating{font-size:28px;font-weight:850}.small{font-size:13px}.hidden{display:none}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div class="nav">
<button data-tab="home">🏆<br><span class="small">Ligen</span></button>
<button data-tab="teams">👥<br><span class="small">Teams</span></button>
<button data-tab="players">⚽<br><span class="small">Spieler</span></button>
<button data-tab="matches">📅<br><span class="small">Spiele</span></button>
</div>
<script>
const KEY="liga-manager-v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 leagues:[{id:"l1",name:"Meine Liga",season:"2026/27"}],
 teams:[{id:"t1",league:"l1",name:"FC Beispiel"},{id:"t2",league:"l1",name:"United FC"}],
 players:[
 {id:"p1",team:"t1",name:"Lukas Müller",pos:"ST",nr:9,rating:87,value:42.5,goals:19,assists:8,apps:24,photo:""},
 {id:"p2",team:"t1",name:"Max Schneider",pos:"ZM",nr:8,rating:82,value:25,goals:6,assists:11,apps:22,photo:""},
 {id:"p3",team:"t2",name:"Jonas Weber",pos:"TW",nr:1,rating:84,value:18,goals:0,assists:0,apps:25,photo:""}
 ],
 matches:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function id(){return Math.random().toString(36).slice(2,10)}
function teamName(tid){return state.teams.find(t=>t.id===tid)?.name||"—"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function avatar(p,size=58){return p.photo?`<img class="avatar" style="width:${size}px;height:${size}px" src="${p.photo}">`:`<div class="avatar" style="width:${size}px;height:${size}px">${esc(p.name.split(" ").map(x=>x[0]).slice(0,2).join(""))}</div>`}
function layout(title,body,action=""){document.querySelector("#app").innerHTML=`<header><h1>${title}</h1>${action}</header>${body}`;wire()}
function wire(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>render(b.dataset.tab))}
function render(tab="home"){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 if(tab==="home") home(); if(tab==="teams") teams(); if(tab==="players") players(); if(tab==="matches") matches();
}
function home(){
 let l=state.leagues[0]; let ms=state.matches.filter(m=>m.league===l.id);
 layout("Liga Manager",`<div class="card"><h2 style="margin-top:0">${esc(l.name)}</h2><div class="muted">${esc(l.season)}</div></div>
 <div class="grid"><div class="stat"><b>${state.teams.length}</b>Teams</div><div class="stat"><b>${state.players.length}</b>Spieler</div><div class="stat"><b>${ms.length}</b>Spiele</div><div class="stat"><b>${state.players.reduce((a,p)=>a+p.goals,0)}</b>Tore</div></div>
 <h2>Schnellzugriff</h2><div class="card row"><button onclick="newLeague()">＋ Liga</button><button onclick="newTeam()">＋ Team</button><button onclick="newPlayer()">＋ Spieler</button></div>
 <div class="card"><h3>Tabelle</h3>${tableHTML()}</div>
 <div class="card"><h3>Torschützen</h3>${scorersHTML()}</div>`);
}
function tableHTML(){
 let rows=state.teams.map(t=>{let p=state.matches.filter(m=>m.played&&(m.home===t.id||m.away===t.id));let pts=0,gf=0,ga=0,w=0,d=0,l=0;p.forEach(m=>{let home=m.home===t.id,h=+m.hg,a=+m.ag;gf+=home?h:a;ga+=home?a:h;let x=home?h-a:a-h;if(x>0){pts+=3;w++}else if(x===0){pts++;d++}else l++});return {t,pts,gf,ga,w,d,l}}).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
 return `<table><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>P</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.t.name)}</td><td>${r.w+r.d+r.l}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td><b>${r.pts}</b></td></tr>`).join("")}</table>`
}
function scorersHTML(){return [...state.players].sort((a,b)=>b.goals-a.goals).slice(0,5).map((p,i)=>`<div class="row card" style="margin:6px 0">${avatar(p,42)}<div class="grow"><b>${i+1}. ${esc(p.name)}</b><div class="muted small">${teamName(p.team)}</div></div><b>${p.goals} Tore</b></div>`).join("")}
function teams(){
 layout("Mannschaften",`${state.teams.map(t=>`<div class="card row"><div class="grow"><b>${esc(t.name)}</b><div class="muted small">${state.players.filter(p=>p.team===t.id).length} Spieler</div></div><button class="secondary" onclick="editTeam('${t.id}')">Bearbeiten</button><button onclick="teamPlayers('${t.id}')">Kader</button></div>`).join("")}<button onclick="newTeam()">＋ Mannschaft hinzufügen</button>`);
}
function teamPlayers(tid){
 let t=state.teams.find(x=>x.id===tid);
 layout(esc(t.name),`${state.players.filter(p=>p.team===tid).map(p=>playerCard(p)).join("")}<button onclick="newPlayer('${tid}')">＋ Spieler hinzufügen</button>`);
}
function playerCard(p){return `<div class="card row">${avatar(p)}<div class="grow"><b>${esc(p.name)}</b><div class="muted small">#${p.nr} · ${esc(p.pos)} · ${teamName(p.team)}</div><div class="small">💰 ${p.value.toFixed(1)} Mio. € · ⚽ ${p.goals} · 🅰️ ${p.assists}</div></div><div class="rating">${p.rating}</div><button class="secondary" onclick="editPlayer('${p.id}')">›</button></div>`}
function players(){layout("Spieler",`${state.players.map(playerCard).join("")}<button onclick="newPlayer()">＋ Spieler hinzufügen</button>`)}
function matches(){
 layout("Spiele",`${state.matches.map(m=>`<div class="card row"><div class="grow"><b>${teamName(m.home)} – ${teamName(m.away)}</b><div class="muted small">${new Date(m.date).toLocaleDateString("de-DE")}</div></div><b>${m.played?m.hg+" : "+m.ag:"offen"}</b><button class="secondary" onclick="editMatch('${m.id}')">›</button></div>`).join("")}<button onclick="newMatch()">＋ Spiel hinzufügen</button>`);
}
function form(title,html,onSave){layout(title,`<div class="card">${html}</div>`);document.querySelector("#save").onclick=onSave}
function newLeague(){form("Neue Liga",`<label>Name</label><input id="name" value=""><label>Saison</label><input id="season" value="2026/27"><button id="save">Speichern</button>`,()=>{state.leagues.push({id:id(),name:document.querySelector("#name").value||"Neue Liga",season:document.querySelector("#season").value});save();render("home")})}
function newTeam(){form("Neue Mannschaft",`<label>Name</label><input id="name" value=""><button id="save">Speichern</button>`,()=>{state.teams.push({id:id(),league:state.leagues[0].id,name:document.querySelector("#name").value||"Neue Mannschaft"});save();render("teams")})}
function editTeam(tid){let t=state.teams.find(x=>x.id===tid);form("Mannschaft bearbeiten",`<label>Name</label><input id="name" value="${esc(t.name)}"><button id="save">Speichern</button>`,()=>{t.name=document.querySelector("#name").value||t.name;save();render("teams")})}
function playerForm(p,tid){
 p=p||{id:id(),team:tid||state.teams[0]?.id,name:"",pos:"ST",nr:0,rating:70,value:0,goals:0,assists:0,apps:0,photo:""};
 form(p.name?"Spieler bearbeiten":"Spieler erstellen",`
 <div class="row">${avatar(p,82)}<div class="grow"><label>Spielerfoto</label><input id="photo" type="file" accept="image/*"></div></div>
 <label>Name</label><input id="name" value="${esc(p.name)}"><label>Position</label><input id="pos" value="${esc(p.pos)}">
 <label>Rückennummer</label><input id="nr" type="number" min="0" max="99" value="${p.nr}">
 <label>Gesamtrating</label><input id="rating" type="number" min="1" max="99" value="${p.rating}">
 <label>Marktwert (Mio. €)</label><input id="value" type="number" min="0" step=".1" value="${p.value}">
 <div class="grid"><div><label>Tore</label><input id="goals" type="number" min="0" value="${p.goals}"></div><div><label>Vorlagen</label><input id="assists" type="number" min="0" value="${p.assists}"></div></div>
 <label>Einsätze</label><input id="apps" type="number" min="0" value="${p.apps}"><button id="save">Speichern</button>`,()=>{
 let f=document.querySelector("#photo").files[0]; let finish=photo=>{Object.assign(p,{name:document.querySelector("#name").value||"Spieler",pos:document.querySelector("#pos").value||"ST",nr:+document.querySelector("#nr").value,rating:Math.max(1,Math.min(99,+document.querySelector("#rating").value)),value:Math.max(0,+document.querySelector("#value").value),goals:Math.max(0,+document.querySelector("#goals").value),assists:Math.max(0,+document.querySelector("#assists").value),apps:Math.max(0,+document.querySelector("#apps").value),photo:photo||p.photo});if(!state.players.some(x=>x.id===p.id))state.players.push(p);save();players()};
 if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(p.photo)
 })
}
function newPlayer(tid){playerForm(null,tid)}
function editPlayer(pid){playerForm(state.players.find(p=>p.id===pid))}
function newMatch(){form("Neues Spiel",`<label>Heim</label><select id="home">${state.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><label>Gast</label><select id="away">${state.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><label>Datum</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><button id="save">Spiel erstellen</button>`,()=>{state.matches.push({id:id(),league:state.leagues[0].id,home:home.value,away:away.value,date:date.value,hg:0,ag:0,played:false,goals:[]});save();matches()})}
function editMatch(mid){let m=state.matches.find(x=>x.id===mid);form("Spiel bearbeiten",`<div class="card"><b>${teamName(m.home)} – ${teamName(m.away)}</b></div><label>Heimtore</label><input id="hg" type="number" min="0" value="${m.hg}"><label>Gasttore</label><input id="ag" type="number" min="0" value="${m.ag}"><label><input id="played" type="checkbox" ${m.played?"checked":""}> Spiel beendet</label><h3>Torschützen</h3><div id="goalsList">${(m.goals||[]).map((g,i)=>`<div class="row card"><span class="grow">${esc(state.players.find(p=>p.id===g.player)?.name||"Spieler")} · ${g.minute}'</span><button class="danger" onclick="removeGoal('${mid}',${i})">×</button></div>`).join("")}</div><button class="secondary" onclick="addGoal('${mid}')">＋ Tor hinzufügen</button><br><br><button id="save">Speichern</button>`,()=>{m.hg=+hg.value;m.ag=+ag.value;m.played=played.checked;save();matches()})}
function addGoal(mid){let m=state.matches.find(x=>x.id===mid);let p=prompt("Spieler-ID?\\n"+state.players.map(p=>p.id+" = "+p.name).join("\\n"));let pl=state.players.find(x=>x.id===p);if(!pl)return;let min=+(prompt("Minute", "1")||1);m.goals=m.goals||[];m.goals.push({player:pl.id,minute:min});pl.goals++;save();editMatch(mid)}
function removeGoal(mid,i){let m=state.matches.find(x=>x.id===mid);let g=m.goals.splice(i,1)[0];let p=state.players.find(x=>x.id===g.player);if(p)p.goals=Math.max(0,p.goals-1);save();editMatch(mid)}
render();
</script>
</body></html>
