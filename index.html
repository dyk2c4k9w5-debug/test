tourcard{display:flex;align-items:center;gap:11px;min-height:66px;border-bottom:1px solid #ffffff22;padding:8px 4px;cursor:pointer}.touricon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff38;background:#ffffff10;font-size:22px}.tourcard .arrow{font-size:28px;opacity:.55}.mainadd{width:100%;margin-top:14px}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0}.homegrid button{min-height:47px;border:1px solid #ffffff2b;background:#ffffff16;border-radius:11px;font-weight:850}.homegrid button:first-child{color:#58a5ff}

.teamclick{cursor:pointer}.teamlogoBtn{background:none;border:0;padding:0}.teamrow .shirt img,.teamrow .flag img{width:23px;height:23px;object-fit:contain;border-radius:5px}.teamhero{display:flex;align-items:center;gap:10px;padding:10px 0 15px;border-bottom:1px solid #ffffff22}.biglogo{width:64px;height:64px}.biglogo img{width:100%;height:100%;object-fit:contain;border-radius:18px}.teamvisuals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.visual{background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:10px;text-align:center}.visualimg{height:55px;display:grid;place-items:center;font-size:32px}.visualimg img{max-width:55px;max-height:55px;object-fit:contain}.visualrate{height:55px;display:grid;place-items:center;font-size:24px;font-weight:900}.playerteamrow{display:flex;align-items:center;gap:10px;padding:10px 3px;border-bottom:1px solid #ffffff20}.playerteamrow .picon{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#ffffff12;display:grid;place-items:center;font-size:14px}.playerteamrow .picon img{width:100%;height:100%;object-fit:cover}.playerstats{display:grid;grid-template-columns:auto auto;column-gap:5px;text-align:right;font-size:11px}.playerstats span{opacity:.55;font-size:8px}.editteamtop{display:flex;gap:12px;align-items:flex-end}
.teamgo{margin-left:auto;font-size:25px;opacity:.55;line-height:1}.teamopenbtn{display:flex;align-items:center;justify-content:center;height:32px;padding:0 7px;border:1px solid #ffffff45;border-radius:9px;color:#fff;text-decoration:none;font-size:10px;font-weight:900;background:#ffffff10;white-space:nowrap}.teamrow{touch-action:manipulation;user-select:none;display:grid;grid-template-columns:minmax(0,1fr) 68px 30px 30px 58px 34px;gap:7px;align-items:center;min-height:53px;border-bottom:1px solid #ffffff20;cursor:pointer}.teamrow:active{opacity:.72}.teamrow .teamopen{width:100%;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 0;background:transparent;border:0;color:inherit;text-align:left}.teamrow .teamopen .teamname{min-width:0;display:flex;flex-direction:column;justify-content:center}.teamrow .teamopen .teamname b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamrow .teamopen .teamname span{font-size:10px;opacity:.58;margin-top:2px}.teamrow .shirt{font-size:20px;text-align:center}.teamrow .flag{font-size:18px;text-align:center}.rate{font-size:12px;font-weight:850;background:#ffffff12;border:1px solid #ffffff25;border-radius:15px;padding:6px 7px;text-align:center}.remove{width:28px;height:28px;border:1px solid #ff285d;background:transparent;color:#ff285d;border-radius:50%;font-weight:900}.teamadd{display:grid;grid-template-columns:30px 1fr 42px;gap:8px;align-items:center;padding-top:10px}.teamadd input{margin:0;background:#ffffff10;color:#fff;border:0;border-bottom:1px solid #ffffff55;border-radius:0;padding:10px}.teamadd button{background:transparent;color:#58e66d;font-size:25px;padding:5px}.fab{position:fixed;right:20px;bottom:24px;width:52px;height:52px;border-radius:50%;border:0;background:#ff285d;box-shadow:0 7px 20px #0005;font-size:27px}.sheetbg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:10}.sheet{width:100%;max-width:560px;margin:auto;background:#122967;border:1px solid #ffffff2b;border-radius:24px 24px 0 0;padding:18px 15px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h2{margin:0 0 12px;font-size:19px}.sheet input,.sheet select{width:100%;background:#081a4b;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:12px;margin:4px 0 10px}.sheet label{font-size:11px;opacity:.7}.sheet button.primary{width:100%;padding:12px;border:0;border-radius:12px;background:#ff285d;font-weight:900;margin-top:4px}.close{float:right;background:#ffffff15;border:0;border-radius:10px;padding:7px 10px}.photo{width:70px;height:70px;border-radius:18px;object-fit:cover;background:#ffffff18}
@media(min-width:700px){.wrap{padding-left:20px;padding-right:20px}}

<body><div id="root"></div>
<script>
const KEY="liga-manager-v5";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{
 league:{name:"Turnier",season:"2026/27"},
 teams:[
  {id:"a",name:"FC Beispiel"},
  {id:"b",name:"United FC"},
  {id:"c",name:"City FC"},
  {id:"d",name:"SV Berlin"},
  {id:"e",name:"SC Köln"},
  {id:"f",name:"Rheinland"},
  {id:"g",name:"Nord FC"},
  {id:"h",name:"Westfalen"}
 ],
 players:[
  {id:"p1",team:"a",name:"Lukas Müller",pos:"ST",rating:87,value:42,goals:19,assists:10,apps:24,photo:""},
  {id:"p2",team:"b",name:"Jonas Weber",pos:"ST",rating:85,value:35,goals:15,assists:8,apps:22,photo:""},
  {id:"p3",team:"c",name:"Max Schneider",pos:"OM",rating:84,value:31,goals:13,assists:10,apps:23,photo:""},
  {id:"p4",team:"d",name:"Felix Bauer",pos:"ST",rating:82,value:27,goals:11,assists:7,apps:21,photo:""}
 ],
 matches:[
  {id:"m1",round:1,date:"23. Mai",time:"15:30",home:"a",away:"b",hg:3,ag:0,played:true},
  {id:"m2",round:1,date:"23. Mai",time:"15:30",home:"c",away:"d",hg:2,ag:2,played:true},
  {id:"m3",round:1,date:"24. Mai",time:"15:30",home:"e",away:"f",hg:1,ag:0,played:true},
  {id:"m4",round:1,date:"24. Mai",time:"15:30",home:"g",away:"h",hg:1,ag:1,played:true}
 ]};
let screen="main", tab="groups", sub="scorers", round=1;
const $=x=>document.querySelector(x), save=()=>localStorage.setItem(KEY,JSON.stringify(s));

/* Migration from older versions: keep existing teams/players and create a tournament
   without automatically changing future team-creation behavior. */
if(!Array.isArray(s.tournaments)){
  const oldLeague=s.league||{name:"1. Bundesliga",season:"2026/27"};
  const existingTeams=Array.isArray(s.teams)?s.teams:[];
  s.tournaments=[{id:"tour1",name:oldLeague.name||"Mein Turnier",season:oldLeague.season||"2026/27",teamIds:existingTeams.map(t=>t.id)}];
  s.currentTournament="tour1";
  delete s.league;
  save();
}
if(!Array.isArray(s.teams)) s.teams=[];
if(!Array.isArray(s.players)) s.players=[];
if(!Array.isArray(s.matches)) s.matches=[];

/* Attach existing untagged matches to the correct tournament. */
let matchesMigrated=false;
if(Array.isArray(s.tournaments)&&Array.isArray(s.matches)){
  s.matches.forEach(m=>{
    if(m.tournamentId) return;
    const candidates=s.tournaments.filter(t=>(t.teamIds||[]).includes(m.home)&&(t.teamIds||[]).includes(m.away));
    if(candidates.length===1){m.tournamentId=candidates[0].id;matchesMigrated=true;}
    else if(candidates.some(t=>String(t.id)===String(s.currentTournament))){m.tournamentId=s.currentTournament;matchesMigrated=true;}
  });
  if(matchesMigrated) save();
}
function matchInTournament(m,t=tournament()){return !!t && (!m.tournamentId || String(m.tournamentId)===String(t.id));}

/* Remove demo teams from earlier assistant versions (a-h) while keeping user-created teams. */
const demoTeamIds=new Set(["a","b","c","d","e","f","g","h"]);
if(Array.isArray(s.teams)){
  const hadDemo=s.teams.some(t=>demoTeamIds.has(t.id));
  if(hadDemo){
    s.teams=s.teams.filter(t=>!demoTeamIds.has(t.id));
    if(Array.isArray(s.tournaments)) s.tournaments.forEach(t=>t.teamIds=(t.teamIds||[]).filter(id=>!demoTeamIds.has(id)));
    if(Array.isArray(s.players)) s.players=s.players.filter(p=>!demoTeamIds.has(p.team));
    if(Array.isArray(s.matches)) s.matches=s.matches.filter(m=>!demoTeamIds.has(m.home)&&!demoTeamIds.has(m.away));
    save();
  }
}

s.tournaments.forEach(t=>{t.sport=t.sport||"Fußball";t.format=t.format||"league";t.teamCount=t.teamCount||Math.max((t.teamIds||[]).length,2);t.groupCount=t.groupCount||1;t.rounds=t.rounds||2;t.groups=t.groups||[]});
s.tournaments.forEach(t=>{t.sport=t.sport||"Fußball";t.format=t.format||"league";t.teamCount=t.teamCount||Math.max((t.teamIds||[]).length,2);t.groupCount=t.groupCount||1;t.groupSize=t.groupSize||Math.max(2,Math.ceil((t.teamCount||2)/(t.groupCount||1)));t.rounds=t.rounds||2;t.groups=t.groups||[]});
s.tournaments.forEach(t=>{if(t.format==="league"){let n=t.teamCount||((t.teamIds||[]).length)||2;t.maxRounds=t.maxRounds||leagueMatchdays(n,t.rounds||2)}});
function tournament(){return s.tournaments.find(t=>t.id===s.currentTournament)||s.tournaments[0]||{id:"tour1",name:"Mein Turnier",season:"2026/27",teamIds:[]}}

function tournamentTeams(){let t=tournament();return s.teams.filter(x=>t?.teamIds?.includes(x.id))}
function teamInTournament(tid){return !!tournament()?.teamIds?.includes(tid)}
function addToTournament(tid){
  let t=tournament();if(!t||t.teamIds.includes(tid))return;
  if(t.teamIds.length>=(t.teamCount||999))return alert(`Dieses Turnier ist auf ${t.teamCount} Teams begrenzt.`);
  t.teamIds.push(tid);buildTournamentGroups(t);save();teamManage();
}
function removeFromTournament(tid){
  let t=tournament();if(t){t.teamIds=t.teamIds.filter(x=>x!==tid);buildTournamentGroups(t);}
  save();teamManage();
}
function setTournament(tid){s.currentTournament=tid;save();closeModal();window.teamView="mine";tab="preview";render()}

const team=id=>s.teams.find(x=>x.id===id)?.name||"—";
const init=n=>(n||"?").split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();
function header(){
  if(screen==="main"){
    return `<div class="head"><div><div class="title">Liga Manager</div><div style="font-size:11px;opacity:.62">Hauptmenü · v45</div></div></div>`;
  }
  return `<div class="head"><button class="gear" onclick="goMain()">‹</button><div class="title">${tournament()?.name||"Turnier"}</div><div><select class="season" onchange="tournament().season=this.value;save();render()"><option>${tournament()?.season||""}</option><option>2026/27</option><option>2027/28</option><option>2028/29</option></select><button class="gear" onclick="settings()">⚙︎</button></div></div>
  <div class="tabs">${["preview","groups","matches","stats"].map(x=>`<button class="${tab===x?"active":""}" onclick="tab='${x}';render()">${x.toUpperCase()}</button>`).join("")}</div>`;
}
function goMain(){history.replaceState({},'',location.pathname);screen="main";render()}

function render(){
  document.body.scrollTop=0;
  if(screen==="main"){
    $("#root").innerHTML=`<div class="wrap">${header()}${mainMenu()}</div>`;
    return;
  }
  if(screen==="teamDetail"){
    $("#root").innerHTML=`<div class="wrap">${teamDetail()}</div>`;
    return;
  }
  if(screen==="teams"){
    teamManage();
    return;
  }
  $("#root").innerHTML=`<div class="wrap">${header()}${tab==="preview"?preview():tab==="groups"?groups():tab==="matches"?matches():stats()}</div>`;
}
function mainMenu(){
  let cards=s.tournaments.map(t=>`<div class="tourcard" onclick="selectTournament('${t.id}')">
    <div class="touricon">🏆</div><div class="grow"><b>${t.name}</b><div class="small" style="opacity:.62">${t.season} · ${(t.teamIds||[]).length} Teams</div></div><span class="arrow">›</span>
  </div>`).join("");
  return `<div style="padding-top:14px"><div class="sectiontitle">MEINE TURNIERE</div>${cards||`<div class="empty">Noch kein Turnier erstellt.</div>`}<button class="primary mainadd" onclick="newTournament(true)">＋ NEUES TURNIER ERSTELLEN</button></div>`;
}
function selectTournament(tid){s.currentTournament=tid;save();screen="tournament";tab="preview";render()}
function preview(){
  let active=tournament();
  return `<div style="padding-top:8px"><div class="empty" style="padding:16px 8px 10px"><div style="font-size:45px">🏆</div><div style="font-size:11px;opacity:.7">TURNIER</div><h2 style="margin:3px 0">${active?.name||"Turnier"}</h2><div style="font-size:12px;opacity:.65">${active?.season||""}</div><div style="font-size:11px;opacity:.55;margin-top:5px">${active?.sport||"Fußball"} · ${active?.format==="groups"?(active?.groupCount||2)+" Gruppen · "+(active?.groupSize||0)+" Teams/Gruppe":"Liga · "+(active?.teamCount||0)+" Teams"} · ${active?.rounds||2}× gegeneinander · ${active?.format==="league"?leagueMatchdays(active?.teamCount||0,active?.rounds||2):""} Spieltage</div></div>
  <div class="homegrid"><button onclick="teamManage()">Teams verwalten</button><button onclick="openDraw()">Auslosung</button><button onclick="tab='groups';render()">Tabelle</button><button onclick="tab='matches';render()">Spiele</button><button onclick="tab='stats';render()">Statistiken</button><button onclick="settings()">Turnier bearbeiten</button><button onclick="goMain()">Hauptmenü</button></div></div>`;
}

function openDraw(){
  const t=tournament(), count=(t?.teamIds||[]).length;
  if(!t || count<2){return modal(`<h2>Auslosung</h2><div class="empty">Füge zuerst mindestens 2 Teams zum Turnier hinzu.</div>`)}
  if(t.format==="groups"){
    modal(`<h2>🏆 Gruppen auslosen</h2>
      <div class="formhint">${t.groupCount||2} Gruppen · ${t.groupSize||0} Teams pro Gruppe</div>
      <div class="drawbox"><b>Automatische Auslosung</b><p>Alle Teams werden zufällig auf die Gruppen verteilt.</p><button class="primary" onclick="autoDrawGroups()">AUTOMATISCHE AUSLOSUNG</button></div>
      <div class="drawbox"><b>Manuelle Auslosung</b><p>Du kannst die Teams nacheinander selbst den Gruppen zuweisen.</p><button class="primary" onclick="manualDrawGroups()">MANUELLE AUSLOSUNG</button></div>`);
  }else{
    modal(`<h2>📅 Spielplan auslosen</h2>
      <div class="formhint">${count} Teams · ${t.rounds||2}× gegeneinander</div>
      <div class="drawbox"><b>Automatische Auslosung</b><p>Der komplette Spielplan wird automatisch erstellt.</p><button class="primary" onclick="generateLeagueSchedule()">AUTOMATISCH AUSLOSEN</button></div>
      <div class="drawbox"><b>Manuelle Auslosung</b><p>Du bestimmst für jeden Spieltag selbst, welche Mannschaften gegeneinander spielen.</p><button class="primary" onclick="manualScheduleStart()">MANUELL AUSLOSEN</button></div>
      <div class="drawbox"><b>Neu auslosen</b><p>Vorhandene noch nicht gespielte Spiele dieses Turniers werden ersetzt.</p><button class="primary" onclick="generateLeagueSchedule(true)">NEU AUSLOSEN</button></div>`);
  }
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function autoDrawGroups(){
  const t=tournament(), teams=shuffle(t.teamIds||[]);
  if(teams.length !== (t.groupCount||2)*(t.groupSize||4)) return alert(`Bitte füge genau ${t.groupCount*t.groupSize} Teams hinzu.`);
  t.groups=Array.from({length:t.groupCount},(_,i)=>({name:`Gruppe ${String.fromCharCode(65+i)}`,teamIds:[]}));
  teams.forEach((id,i)=>t.groups[i%t.groupCount].teamIds.push(id));
  save();closeModal();tab="groups";render();
}
function manualDrawGroups(){
  const t=tournament(), teams=shuffle(t.teamIds||[]);
  if(teams.length !== (t.groupCount||2)*(t.groupSize||4)) return alert(`Bitte füge genau ${t.groupCount*t.groupSize} Teams hinzu.`);
  const n=t.groupCount||2, size=t.groupSize||4;
  t.groups=Array.from({length:n},(_,i)=>({name:`Gruppe ${String.fromCharCode(65+i)}`,teamIds:[]}));
  let pos=0;
  function step(){
    if(pos>=teams.length){save();closeModal();tab="groups";render();return}
    const options=t.groups.filter(g=>g.teamIds.length<size);
    modal(`<h2>Manuelle Auslosung</h2><div class="formhint">Team ${pos+1} von ${teams.length}</div>
      <div class="drawteam"><div class="logo">${init(team(teams[pos]))}</div><b>${team(teams[pos])}</b></div>
      ${options.map(g=>`<button class="primary" style="margin-top:7px" onclick="manualAssignGroup('${g.name}')">${g.name} (${g.teamIds.length}/${size})</button>`).join("")}`);
  }
  window.manualAssignGroup=function(name){
    const g=t.groups.find(x=>x.name===name); if(g)g.teamIds.push(teams[pos++]);
    step();
  };
  step();
}

function leagueMatchdays(teamCount, meetings){
  // Round-robin: even n => n-1 matchdays per cycle; odd n => n matchdays.
  const cycle=teamCount%2===0 ? teamCount-1 : teamCount;
  return cycle*Math.max(1,Math.min(4,meetings||2));
}
function clearUpcomingMatches(){
  const t=tournament(), ids=new Set(t?.teamIds||[]);
  s.matches=s.matches.filter(m=>{
    const belongs=matchInTournament(m,t) && ids.has(m.home)&&ids.has(m.away);
    return !belongs || m.played;
  });
}
function makeRoundRobin(teamIds, meetings){
  let arr=[...teamIds];
  if(arr.length%2)arr.push(null);
  const n=arr.length, cycle=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      let home=arr[i],away=arr[n-1-i];
      if(home&&away){
        if(r%2===1)[home,away]=[away,home];
        pairs.push([home,away]);
      }
    }
    cycle.push(pairs);
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  const out=[];
  const rounds=Math.max(1,Math.min(4,meetings||2));
  for(let c=0;c<rounds;c++){
    cycle.forEach((pairs,r)=>{
      pairs.forEach(([home,away])=>{
        if(c%2===1)[home,away]=[away,home];
        out.push({round:c*cycle.length+r+1,home,away});
      });
    });
  }
  return out;
}
function generateLeagueSchedule(redraw=false){
  const t=tournament(), teams=shuffle(t.teamIds||[]);
  if(teams.length<2)return alert("Mindestens 2 Teams erforderlich.");
  if(teams.length !== (t.teamCount||teams.length))return alert(`Bitte füge genau ${t.teamCount} Teams hinzu.`);
  if(redraw && !confirm("Alle noch nicht gespielten Spiele dieses Turniers neu auslosen?"))return;
  clearUpcomingMatches();
  const generated=makeRoundRobin(teams,t.rounds).map((x,i)=>({
    id:Date.now()+"-"+i,round:x.round,date:"",time:"",home:x.home,away:x.away,tournamentId:t.id,hg:0,ag:0,played:false
  }));
  s.matches=s.matches.concat(generated);
  t.matchdays=leagueMatchdays(teams.length,t.rounds); t.maxRounds=t.matchdays;
  save();closeModal();tab="matches";round=1;render();
}

function standingsFor(teamIds, tour=tournament()){
  const ids=new Set(teamIds||[]);
  const rows=(teamIds||[]).map(id=>{
    const t=s.teams.find(x=>String(x.id)===String(id));
    let sp=0,w=0,d=0,l=0,gf=0,ga=0,form=[];
    const played=s.matches.filter(m=>matchInTournament(m,tour)&&m.played&&ids.has(m.home)&&ids.has(m.away)&&(String(m.home)===String(id)||String(m.away)===String(id)));
    played.forEach(m=>{
      const home=String(m.home)===String(id);
      const a=Number(home?m.hg:m.ag)||0, b=Number(home?m.ag:m.hg)||0;
      sp++; gf+=a; ga+=b;
      if(a>b){w++;form.push('W')} else if(a===b){d++;form.push('D')} else {l++;form.push('L')}
    });
    return {t,sp,w,d,l,gf,ga,gd:gf-ga,pts:w*3+d,form};
  });

  // Tiebreaker: points -> goal difference -> goals scored -> direct comparison.
  function directValue(a,b){
    const tied=new Set(rows.filter(x=>x.pts===a.pts&&x.gd===a.gd&&x.gf===a.gf).map(x=>String(x.t.id)));
    if(!tied.has(String(a.t.id))||!tied.has(String(b.t.id))) return 0;
    let ap=0,bp=0,agd=0,bgd=0,agf=0,bgf=0;
    s.matches.filter(m=>matchInTournament(m,tour)&&m.played&&tied.has(String(m.home))&&tied.has(String(m.away))).forEach(m=>{
      const h=String(m.home), aw=String(m.away), hg=Number(m.hg)||0, ag=Number(m.ag)||0;
      if(h===String(a.t.id)){agf+=hg;agd+=hg-ag;ap+=hg>ag?3:hg===ag?1:0}
      else if(aw===String(a.t.id)){agf+=ag;agd+=ag-hg;ap+=ag>hg?3:ag===hg?1:0}
      if(h===String(b.t.id)){bgf+=hg;bgd+=hg-ag;bp+=hg>ag?3:hg===ag?1:0}
      else if(aw===String(b.t.id)){bgf+=ag;bgd+=ag-hg;bp+=ag>hg?3:ag===hg?1:0}
    });
    return (ap-bp)||(agd-bgd)||(agf-bgf);
  }
  return rows.sort((a,b)=>{
    return (b.pts-a.pts)||(b.gd-a.gd)||(b.gf-a.gf)||directValue(b,a);
  });
}
function tableHTML(teamIds, tour=tournament(), title=''){
  const rows=standingsFor(teamIds,tour);
  return `${title?`<div style="margin:12px 0 5px;font-weight:900">${title}</div>`:''}<div class="table"><div class="tr headrow"><div>#</div><div>TEAM</div><div>SP</div><div>S</div><div>U</div><div>N</div><div>TORE</div><div>TD</div><div>P</div></div>${rows.map((r,i)=>`<div class="tr"><div>${i+1}</div><div class="team"><div class="logo">${r.t?.logo?`<img src="${r.t.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:50%">`:init(r.t?.name||'—')}</div><span>${r.t?.name||'—'}</span></div><div>${r.sp}</div><div>${r.w}</div><div>${r.d}</div><div>${r.l}</div><div>${r.gf}:${r.ga}</div><div>${r.gd>0?'+':''}${r.gd}</div><div class="p">${r.pts}</div></div>`).join('')||`<div class="empty" style="padding:18px">Teams über „Teams verwalten“ hinzufügen.</div>`}</div>`;

function teamOverall(tid){
  const starters=s.players.filter(p=>p.team===tid && p.starter);

  if(!vals.length)return null;
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
}

function settings(){let t=tournament();modal(`<h2>Turnier verwalten</h2><label>Turniername</label><input id="ln" value="${t?.name||""}"><label>Saison</label><input id="ls" value="${t?.season||""}"><button class="primary" onclick="t.name=$('#ln').value||t.name;t.season=$('#ls').value||t.season;save();closeModal();render()">Speichern</button><hr style="border:0;border-top:1px solid #ffffff22;margin:18px 0"><button class="primary" onclick="closeModal();teamManage()">Teams verwalten</button><button class="primary" onclick="newTournament()">＋ Neues Turnier</button>`)}
function quickAdd(){settings()}
function newTeam(){modal(`<h2>Neues Team</h2><label>Teamname</label><input id="tn" placeholder="z. B. Bayern München"><button class="primary" onclick="s.teams.push({id:Date.now()+'',name:$('#tn').value||'Neues Team'});save();closeModal();render()">Team erstellen</button>`)}
function opts(sel="",onlyTournament=false){return (onlyTournament?tournamentTeams():s.teams).map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${t.name}</option>`).join("")}
function newPlayer(teamId=""){
  modal(`<h2>Neuer Spieler</h2><label>Name</label><input id="pn" placeholder="Vor- und Nachname"><label>Team</label><select id="pt">${opts(teamId)}</select><label>Position</label><input id="pp" placeholder="ST, ZM, TW ..."><label>Rating</label><input id="pr" type="number" value="75" min="1" max="99"><label>Marktwert (Mio.)</label><input id="pv" type="number" value="10" step=".1"><label>Foto</label><input id="ph" type="file" accept="image/*"><label class="checkrow"><input id="ps" type="checkbox"> Spieler zur Startelf hinzufügen</label><button class="primary" onclick="addPlayer('${teamId}')">SPIELER SPEICHERN</button>`);
}
function addPlayer(returnTeam=""){let f=$("#ph").files[0],done=photo=>{const tid=$("#pt").value;s.players.push({id:Date.now()+'',team:tid,name:$("#pn").value||"Neuer Spieler",pos:$("#pp").value||"—",rating:+$("#pr").value||0,value:+$("#pv").value||0,goals:0,assists:0,apps:0,starter:!!$("#ps")?.checked,photo:photo||""});save();closeModal();if(returnTeam){window.teamDetail=returnTeam;screen="teamDetail";render()}else{tab="stats";render()}};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}
function editPlayer(pid){let p=s.players.find(x=>x.id===pid);modal(`<h2>${p.name}</h2>${p.photo?`<img class="photo" src="${p.photo}">`:""}<label>Team</label><select id="pt">${opts(p.team)}</select><label>Position</label><input id="pp" value="${p.pos}"><label>Rating</label><input id="pr" type="number" value="${p.rating}"><label>Marktwert (Mio.)</label><input id="pv" type="number" step=".1" value="${p.value}"><label>Tore</label><input id="pg" type="number" value="${p.goals||0}"><label>Assists</label><input id="pa" type="number" value="${p.assists||0}"><label>Einsätze</label><input id="app" type="number" value="${p.apps||0}"><label>Foto ändern</label><input id="ph" type="file" accept="image/*"><button class="primary" onclick="updatePlayer('${pid}')">Speichern</button>`)}
function updatePlayer(pid){let p=s.players.find(x=>x.id===pid),f=$("#ph").files[0],done=photo=>{p.team=$("#pt").value;p.pos=$("#pp").value;p.rating=+$("#pr").value||0;p.value=+$("#pv").value||0;p.goals=+$("#pg").value||0;p.assists=+$("#pa").value||0;p.apps=+$("#app").value||0;if(photo)p.photo=photo;save();closeModal();render()};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}
function newMatch(){modal(`<h2>Neues Spiel</h2><label>Heimteam</label><select id="mh">${opts("",true)}</select><label>Auswärtsteam</label><select id="ma">${opts("",true)}</select><label>Runde</label><input id="mr" type="number" value="${round}" min="1"><label>Datum</label><input id="md" placeholder="23. Mai"><label>Uhrzeit</label><input id="mt" value="15:30"><button class="primary" onclick="addMatch()">Spiel speichern</button>`)}
function addMatch(){if(!teamInTournament($("#mh").value)||!teamInTournament($("#ma").value))return alert("Beide Teams müssen im aktuellen Turnier sein.");if($("#mh").value===$("#ma").value)return alert("Bitte zwei verschiedene Teams wählen.");s.matches.push({id:Date.now()+'',round:+$("#mr").value||1,date:$("#md").value,time:$("#mt").value,home:$("#mh").value,away:$("#ma").value,tournamentId:tournament().id,hg:0,ag:0,played:false});save();closeModal();tab="matches";round=+$("#mr").value||1;render()}
render();
</script></body></html>
